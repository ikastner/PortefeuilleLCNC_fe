comment: Heatmap ECharts (taux d'occupation profil × mois) — portefeuille LCNC
scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_CompImport*/
        import * as echarts from ''echarts'';
        /*End_c8o_CompImport*/
        /*Begin_c8o_CompDeclaration*/
        	_chart:any=null;
        	_ro:any=null;
        	/*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompConstructor*/
        		/*End_c8o_CompConstructor*/
        /*Begin_c8o_CompInitialization*/
        		/*End_c8o_CompInitialization*/
        /*Begin_c8o_CompFinalization*/
        		try { if (this._ro) { this._ro.disconnect(); this._ro = null; } if (this._chart) { this._chart.dispose(); this._chart = null; } } catch(e){}
        		/*End_c8o_CompFinalization*/
        /*Begin_c8o_CompChanges*/
        		try { if (this._chart) { this._chart.setOption(this.buildOption(), true); } } catch(e){}
        		/*End_c8o_CompChanges*/
        /*Begin_c8o_CompDoCheck*/
        		/*End_c8o_CompDoCheck*/
        /*Begin_c8o_CompAfterContentInit*/
        		/*End_c8o_CompAfterContentInit*/
        /*Begin_c8o_CompAfterContentChecked*/
        		/*End_c8o_CompAfterContentChecked*/
        /*Begin_c8o_CompAfterViewInit*/
        		try {
        			const host = (this.elRef && this.elRef.nativeElement) ? this.elRef.nativeElement.querySelector(''.ech-host'') : null;
        			if (host) {
        				this._chart = echarts.init(host);
        				this._chart.setOption(this.buildOption(), true);
        				this._ro = new ResizeObserver(() => { if (this._chart) this._chart.resize(); });
        				this._ro.observe(host);
        				setTimeout(() => { try { if (this._chart) this._chart.resize(); } catch(e){} }, 80);
        			}
        		} catch (e) { console.error(''[echHeatmap]'', e); }
        		/*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompAfterViewChecked*/
        		/*End_c8o_CompAfterViewChecked*/
        /*Begin_c8o_CompFunction*/
        	buildOption() {
        		const dark = this.themeMode === ''dark'';
        		const txt = dark ? ''#9aa7bd'' : ''#5b6680'';
        		const surface = dark ? ''#121c33'' : ''#ffffff'';
        		let xcats = [], ycats = [], data = [];
        		try { xcats = (typeof this.xcats === ''string'') ? JSON.parse(this.xcats) : (this.xcats || []); } catch(e){ xcats = []; }
        		try { ycats = (typeof this.ycats === ''string'') ? JSON.parse(this.ycats) : (this.ycats || []); } catch(e){ ycats = []; }
        		try { data = (typeof this.data === ''string'') ? JSON.parse(this.data) : (this.data || []); } catch(e){ data = []; }
        		const min = (this.min != null) ? Number(this.min) : 40;
        		const max = (this.max != null) ? Number(this.max) : 100;
        		return {
        			grid: { left: 8, right: 8, top: 10, bottom: 56, containLabel: true },
        			tooltip: { position: ''top'', backgroundColor: surface, borderColor: dark ? ''#243049'' : ''#EEF1F8'', textStyle: { color: dark ? ''#e6eaf3'' : ''#1a2540'' }, formatter: (p) => (xcats[p.value[0]] + '' · '' + ycats[p.value[1]] + '' : '' + p.value[2] + ''%'') },
        			xAxis: { type: ''category'', data: xcats, splitArea: { show: false }, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: txt } },
        			yAxis: { type: ''category'', data: ycats, splitArea: { show: false }, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: txt } },
        			visualMap: { min: min, max: max, calculable: true, orient: ''horizontal'', left: ''center'', bottom: 6, itemWidth: 12, itemHeight: 120, textStyle: { color: txt }, inRange: { color: [''#E6EFFD'', ''#9DC0F5'', ''#5B8FF0'', ''#1456C7'', ''#0F2B5B''] } },
        			series: [{ type: ''heatmap'', data: data, label: { show: true, color: ''#ffffff'', fontWeight: 500, formatter: (p) => (p.value[2] + ''%'') }, itemStyle: { borderColor: surface, borderWidth: 4, borderRadius: 8 }, emphasis: { itemStyle: { shadowBlur: 10, shadowColor: ''rgba(0,0,0,0.25)'' } } }]
        		};
        	}
        	/*End_c8o_CompFunction*/
        '
