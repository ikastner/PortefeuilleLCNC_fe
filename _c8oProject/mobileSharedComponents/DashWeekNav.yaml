scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_CompDeclaration*/
        	weekNum: string = "5 j";
        	weekRange: string = "";
        	disabledPrev: boolean = false;
        	disabledNext: boolean = false;
        	isOpen: boolean = false;
        	showToday: boolean = false;
        	compact: boolean = false;
        /*End_c8o_CompDeclaration*/
        /*Begin_c8o_CompInitialization*/
        /*End_c8o_CompInitialization*/
        /*Begin_c8o_CompAfterViewInit*/
        /*End_c8o_CompAfterViewInit*/
        /*Begin_c8o_CompFunction*/
        	onPrev() {
        		if (this.disabledPrev) return;
        		if (this.prev && this.prev.emit) this.prev.emit(true);
        	}
        	onNext() {
        		if (this.disabledNext) return;
        		if (this.next && this.next.emit) this.next.emit(true);
        	}
        	onOpen(event) {
        		if (this.openPeriod && this.openPeriod.emit) this.openPeriod.emit(event);
        	}
        	onToday() {
        		if (this.today && this.today.emit) this.today.emit(true);
        	}
        /*End_c8o_CompFunction*/
        '
↓Style [ngx.components.UIStyle-1791451901652]: 
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '.dash-week{
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px;
            border: 1px solid var(--c-border-soft, #DDE3F0);
            border-radius: 999px;
            background: var(--c-white, #fff);
            box-sizing: border-box;
          }
          .dash-week__btn{
            display: inline-grid;
            place-items: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--c-primary, #1A428A);
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            transition: background .15s ease;
          }
          .dash-week__btn:hover{ background: var(--c-primary-1, #EFF4FF); }
          .dash-week__btn:disabled{ opacity: .45; cursor: not-allowed; }
          .dash-week__btn svg{ display: block; }
          .dash-week__label{
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 32px;
            padding: 0 8px 0 6px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            font: 500 14px Roboto, Helvetica, Arial, sans-serif;
            color: var(--c-text-2, #495057);
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            transition: background .15s ease;
          }
          .dash-week__label:hover,
          .dash-week__label.is-open{ background: var(--c-primary-1, #EFF4FF); }
          .dash-week__num{
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--c-primary, #1A428A);
            color: var(--c-white, #fff);
            font-family: Montserrat, Segoe UI, sans-serif;
            font-size: 12px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
          }
          .dash-week__range{
            display: inline-block;
            width: var(--dash-week-range-w, 9.25rem);
            min-width: var(--dash-week-range-w, 9.25rem);
            max-width: var(--dash-week-range-w, 9.25rem);
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            text-align: left;
            box-sizing: border-box;
          }
          .dash-week__caret{
            display: inline-flex;
            color: var(--c-muted, #6C757D);
          }
          .dash-week__caret svg{ display: block; }
          .dash-week__today{
            height: 32px;
            padding: 0 12px;
            margin-left: 4px;
            border: 0;
            border-radius: 999px;
            background: var(--c-primary-1, #EFF4FF);
            color: var(--c-primary, #1A428A);
            font: 600 13px Roboto, Helvetica, Arial, sans-serif;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
          }
          .dash-week__today:hover{ background: var(--c-primary-2, #DBE7FF); }
          .dash-week--compact .dash-week__label{ height: 30px; padding: 0 8px 0 6px; font-size: 13px; gap: 6px; }
          .dash-week--compact .dash-week__num{ padding: 2px 7px; font-size: 11px; }'
