          ':host { display: contents; }
          .sidebar {
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            bottom: 0;
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-width: 0;
            padding: 24px 16px;
            background: #1A428A;
            color: #fff;
            overflow: hidden;
            box-sizing: border-box;
            font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: width 0.2s ease-in-out, padding 0.2s ease-in-out;
          }
          .sidebar__brand {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
            padding: 0;
          }
          .sidebar__logo {
            height: 24px;
            width: 24px;
            object-fit: contain;
            flex: 0 0 auto;
          }
          .sidebar__app {
            font-family: Montserrat, "Segoe UI", sans-serif;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.15;
            white-space: nowrap;
            min-width: 0;
            flex: 1 1 auto;
          }
          .sidebar__app small {
            display: block;
            font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 12px;
            font-weight: 400;
            opacity: 0.7;
          }
          .sidebar__collapse { margin-left: auto; }
          .sidebar__collapse .nav-ico { transition: transform 0.2s ease-in-out; }
          .sidebar__icon-btn {
            display: inline-grid !important;
            place-items: center;
            width: 40px;
            height: 40px;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #fff;
            --background: transparent;
            --color: #fff;
            --padding-start: 0;
            --padding-end: 0;
            flex: 0 0 auto;
          }
          .sidebar__nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
          }
          .sidebar__section {
            margin: 16px 8px 4px;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.6;
            white-space: nowrap;
          }
          .sidebar__nav > .sidebar__section:first-child { margin-top: 0; }
          .nav-btn {
            display: flex !important;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 44px;
            margin: 0;
            padding: 8px 12px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #fff;
            --background: transparent;
            --color: #fff;
            --border-width: 0;
            --padding-start: 12px;
            --padding-end: 12px;
            font-size: 15px;
            font-weight: 400;
            text-align: left;
            white-space: nowrap;
          }
          .nav-btn:hover { background: rgba(255, 255, 255, 0.1); --background: rgba(255, 255, 255, 0.1); }
          .nav-btn.is-active {
            background: #2E5FB6;
            --background: #2E5FB6;
            box-shadow: 4px 4px 6px -3px rgba(16, 79, 131, 0.16);
          }
          .nav-btn__badge {
            margin-left: auto;
            min-width: 22px;
            padding: 1px 7px;
            border-radius: 999px;
            background: #F16501;
            color: #fff;
            font-size: 12px;
            text-align: center;
          }
          .nav-ico {
            width: 20px !important;
            height: 20px !important;
            min-width: 20px !important;
            min-height: 20px !important;
            flex: 0 0 20px;
            display: inline-block;
            background: #fff;
            -webkit-mask: var(--ico) center / contain no-repeat;
            mask: var(--ico) center / contain no-repeat;
          }
