comment: 'Connexion via PortefeuilleLCNC_be.Auth_Login. SI : LDAP. Mac hors SI (variable serveur authHorsSI=true) : code agent + role PFC sans mot de passe. Les droits viennent de PFC_LigneRole, ou du role choisi en hors SI.'
inAutoMenu: false
scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	authHorsSI: boolean;
        	roleOptions: any;
        /*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		this.authHorsSI = false;
        		this.roleOptions = ["LECTEUR", "CONTRIBUTEUR", "GESTIONNAIRE"];
        /*End_c8o_PageConstructor*/
        /*Begin_c8o_PageInitialization*/
        		if (!document.getElementById("pfa-fonts")) {
        			var fonts = this.c8o.endpointConvertigo + "/projects/PortefeuilleLCNC_fe/DisplayObjects/mobile/assets/fonts/";
        			var face = function (famille, poids, fichier) {
        				return ''@font-face { font-family: "'' + famille + ''"; font-style: normal; font-weight: '' + poids + ''; font-display: swap; src: url("'' + fonts + fichier + ''") format("woff2"); }'';
        			};
        			var style = document.createElement("style");
        			style.id = "pfa-fonts";
        			style.textContent = face("Montserrat", 700, "montserrat-latin-700-normal.woff2") + face("Montserrat", 400, "montserrat-latin-400-normal.woff2") + face("Roboto", 400, "roboto-latin-400-normal.woff2");
        			document.head.appendChild(style);
        		}
        /*End_c8o_PageInitialization*/
        /*Begin_c8o_PageFunction*/
        	pfChargerAuthHorsSI(): Promise<any> {
        		var self = this;
        		return this.pfAppel("PortefeuilleLCNC_be.Get_Auth_Hors_SI", {}).then(function (res) {
        			var d = res && (res.document || res);
        			var data = d && d.data ? d.data : d;
        			var v = data && data.authHorsSI;
        			self.authHorsSI = v === true || v === "true" || v === 1 || v === "1";
        			return res;
        		});
        	}
        	pfExtraireUser(node, depth?) {
        		if (!node || (depth || 0) > 6) return null;
        		var u = node.user;
        		if (u && (u.codeAgent || u.role)) return u;
        		if (node.document) {
        			var a = this.pfExtraireUser(node.document, (depth || 0) + 1);
        			if (a) return a;
        		}
        		if (node.sequence) {
        			var b = this.pfExtraireUser(node.sequence, (depth || 0) + 1);
        			if (b) return b;
        		}
        		return null;
        	}
        	pfExtraireErreur(node, depth?) {
        		if (!node || (depth || 0) > 6) return null;
        		if (node.error) return node.error;
        		if (node.document) {
        			var a = this.pfExtraireErreur(node.document, (depth || 0) + 1);
        			if (a) return a;
        		}
        		if (node.sequence) {
        			var b = this.pfExtraireErreur(node.sequence, (depth || 0) + 1);
        			if (b) return b;
        		}
        		return null;
        	}
        	pfConnecter(input): Promise<any> {
        		var self = this;
        		var v = input || {};
        		return this.pfAppel("PortefeuilleLCNC_be.Auth_Login", {
        			user: String(v.login || "").trim(),
        			password: v.password || "",
        			testRole: v.testRole || ""
        		}).then(function (res) {
        			var root = res || {};
        			var err = self.pfExtraireErreur(root) || root.error;
        			if (err) {
        				var msg = (err && err.message) ? String(err.message) : String(err);
        				return { error: { code: (err && err.code) || "403", message: msg }, document: root.document || root };
        			}
        			var user = self.pfExtraireUser(root);
        			if (!user || !user.codeAgent) {
        				return { error: { code: "403", message: "Accès refusé : aucune ligne du portefeuille n’est associée à ce compte." }, document: root.document || root };
        			}
        			if (user.role != null && Object.prototype.toString.call(user.role) !== "[object Array]") {
        				user.role = [user.role];
        			}
        			return { user: user, document: root.document || root };
        		});
        	}
        	pfAppel(seq, params): Promise<any> {
        		var self = this;
        		return new Promise(function(ok) {
        			var p: any = self.c8o.callJsonObject(seq, params);
        			p.then(function(res) { ok(res || {}); return null; });
        			if (p.fail) p.fail(function(err) { ok({ error: { message: String((err && err.message) || err) } }); });
        		});
        	}
        /*End_c8o_PageFunction*/
        '
