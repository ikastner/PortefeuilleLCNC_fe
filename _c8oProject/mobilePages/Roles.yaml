        			}
        		}
        		return out;
        	}
        	onFlag(v) {
        		var s = String(v == null ? "" : v).toLowerCase();
        		return s === "true" || s === "t" || s === "1";
        	}
        	acteurSession() {
        		var so = this.routerProvider && this.routerProvider.sharedObject;
        		var u = so && so.user;
        		return (u && u.codeAgent) ? String(u.codeAgent).trim() : "";
        	}
        	appel(seq, vars) {
        		var args = ["PortefeuilleLCNC_be." + seq];
        		var k;
        		vars = vars || {};
        		for (k in vars) {
        			if (Object.prototype.hasOwnProperty.call(vars, k)) {
        				args.push(k);
        				args.push(vars[k] == null ? "" : String(vars[k]));
