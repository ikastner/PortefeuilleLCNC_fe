          /* Rôles et droits */
          :host { --c-primary-1: #EFF4FF; --c-primary-4: #9EBBF1; --c-success-strong: #0D4210; --sh-blue: 4px 4px 6px -3px rgba(16, 79, 131, 0.16); }
          .roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--s-4); margin-bottom: var(--s-5); }
          .role-card { display: flex; flex-direction: column; gap: 10px; height: 100%; padding: 18px 20px 16px; font: inherit; color: inherit; text-align: left; cursor: pointer; transition: border-color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast); }
          .role-card:hover { border-color: var(--c-primary-4); box-shadow: var(--sh-blue); transform: translateY(-1px); }
          .role-card:focus-visible { outline: none; box-shadow: var(--focus-ring); }
          .role-card__head { display: flex; align-items: flex-start; min-height: 42px; justify-content: space-between; gap: 12px; }
          .role-card__id { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
          .role-card__name { font-family: var(--font-title); font-size: 17px; font-weight: 600; line-height: 1.25; color: var(--c-primary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
          .role-card__code { font-size: 11px; letter-spacing: .04em; color: var(--c-muted); }
          .role-card__score { flex: 0 0 auto; font-family: var(--font-title); font-size: 26px; font-weight: 600; line-height: 1; color: var(--c-primary); }
          .role-card__score small { font-size: 13px; font-weight: 500; color: var(--c-muted); margin-left: 1px; }
          .role-card__score.is-empty { color: var(--c-grey-3); }
          .role-card__bar { display: flex; gap: 4px; margin-top: 6px; }
          .role-card__seg { flex: 1 1 0; height: 6px; border-radius: 3px; background: var(--c-grey-2); }
          .role-card__seg.is-on { background: var(--c-primary); }
          .role-card__rights { font-size: 12px; color: var(--c-muted); }
          .role-card__foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--c-grey-2); }
          .role-card__foot .avatar-stack { min-height: 0; }
          .role-card__count { margin-left: auto; font-family: var(--font-title); font-size: 15px; font-weight: 600; color: var(--c-text); white-space: nowrap; }
          .role-card__count.is-empty { color: var(--c-muted); font-weight: 400; }
          .role-card--new { align-items: center; justify-content: center; gap: 6px; min-height: 0; border: 1.5px dashed var(--c-primary-4); background: transparent; box-shadow: none; color: var(--c-primary); text-align: center; }
          .role-card--new:hover { background: var(--c-primary-1); transform: none; }
          .role-card__plus { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--c-primary-1); }
          .role-card__new-title { font-weight: 600; }
          .role-card__new-sub { font-size: 12px; color: var(--c-muted); }
          
          .callout { display: flex; gap: var(--s-3); padding: var(--s-3) var(--s-4); border-radius: var(--r-md); background: var(--c-info-1); color: #0B4F7C; font-size: 13px; line-height: 1.45; }
          .callout svg { flex: 0 0 auto; margin-top: 1px; }
          .callout a { color: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
          .callout--warning { background: var(--c-warning-1); color: var(--c-warning-text); }
          .callout--danger { background: var(--c-danger-1); color: #7A0C13; }
          .roles-callout { margin-bottom: 16px; }
          
          .card__head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: var(--s-4) var(--s-5) 0; }
          .card__title { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-family: var(--font-title); font-size: var(--fs-h5); color: var(--c-primary); }
          .card__hint { font-size: 13px; }
          .card__body { padding: var(--s-4) var(--s-5) var(--s-5); }
          
          .rights-matrix { width: 100%; border-collapse: collapse; }
          .rights-matrix th, .rights-matrix td { padding: 12px 14px; border-bottom: 1px solid var(--c-grey-2); text-align: center; }
          .rights-matrix thead th { font-family: var(--font-title); font-size: 14px; color: var(--c-primary); }
          .rights-matrix th:first-child, .rights-matrix td:first-child { text-align: left; }
          .rights-matrix tbody tr:hover td { background: var(--c-grey-1); }
          .rights-matrix .yes { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--c-success-1); color: var(--c-success); }
          .rights-matrix .no { color: var(--c-grey-3); }
          
          .check-list { display: flex; flex-direction: column; gap: 8px; }
          .check-card { display: flex; gap: var(--s-3); padding: var(--s-3) var(--s-4); border: 1px solid var(--c-grey-3); border-radius: var(--r-md); background: #fff; cursor: pointer; transition: border-color var(--t-fast), background var(--t-fast); }
          .check-card:hover { border-color: var(--c-primary-4); }
          .check-card.is-checked { border-color: var(--c-primary); background: var(--c-primary-1); }
          .check-card input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--c-primary); flex: 0 0 auto; }
          .check-card__title { font-weight: 500; color: var(--c-text); }
          .check-card__desc { font-size: 12px; color: var(--c-muted); }
          .check-card__code { margin-left: auto; align-self: center; }
          .form-section .callout { margin-top: 12px; }
          
          .drawer .form-grid { grid-template-columns: 1fr; }
