        		});
        	}
        	initiales(name) {
        		var parts = String(name || "?").trim().split(/[\s-]+/);
        		return (((parts[0] || "")[0] || "?") + ((parts[1] || "")[0] || (parts[0] || "")[1] || "")).toUpperCase();
        	}
        	charger() {
        		var self = this;
        		this.loading = true;
        		this.rafraichir();
        		this.appel("Referentiel_Lire", {}).then(function (out) {
        			var ref = self.doc(out);
        			self.roles = self.asList(ref.roles);
        			self.roleDroits = self.asList(ref.roleDroits);
        			self.lignes = self.asList(ref.lignes);
        			self.elements = self.asList(ref.elements);
        			self.participants = self.asList(ref.participants);
        			self.loading = false;
        			self.syncChrome();
        			self.reconstruire();
        		}, function () {
        			self.loading = false;
        			self.message = "Chargement impossible.";
        			self.rafraichir();
        		});
        	}
        	syncChrome() {
        		var self = this;
        		var projets = 0;
        		var gens = 0;
        		var seen = {};
        		(this.elements || []).forEach(function (el) {
        			if (!self.onFlag(el.actif == null ? "true" : el.actif)) return;
        			var hasP = (self.participants || []).some(function (p) { return p.codeElement === el.code; });
        			if ((!el.chefProjet || !hasP) && !seen[el.code]) { seen[el.code] = 1; projets++; }
        		});
        		(this.lignes || []).forEach(function (l) {
        			if (!self.onFlag(l.actif == null ? "true" : l.actif)) return;
        			if (!l.referent || !l.codeRole) gens++;
        		});
        		this.badgeProjets = projets;
        		this.badgeLignes = gens;
        	}
        	droitsDe(code) {
        		var out = [];
        		(this.roleDroits || []).forEach(function (d) { if (String(d.codeRole) === String(code)) out.push(String(d.codeDroit)); });
        		return out.sort();
        	}
        	membresDe(code) {
        		var self = this;
        		return (this.lignes || []).filter(function (l) {
        			return self.onFlag(l.actif == null ? "true" : l.actif) && String(l.codeRole || "") === String(code);
        		}).map(function (l) {
        			var nom = l.libelle || l.cle;
        			return { nom: nom, ini: self.initiales(nom), couleur: l.couleur || "#1A428A", profil: l.profil || "" };
        		});
        	}
        	chipCls(code) {
        		if (code === "GESTIONNAIRE") return "chip chip--violet mono";
        		if (code === "CONTRIBUTEUR") return "chip chip--primary mono";
        		if (code === "LECTEUR") return "chip mono";
        		return "chip chip--info mono";
        	}
        	reconstruire() {
        		var self = this;
        		var nCat = this.catalogue.length;
        		this.roleCards = (this.roles || []).map(function (r) {
        			var membres = self.membresDe(r.code);
        			var dr = self.droitsDe(r.code);
        			var nd = dr.length;
        			var nm = membres.length;
        			return {
        				code: r.code,
        				libelle: r.libelle || r.code,
        				nDroits: String(nd),
        				surCat: "/" + nCat,
        				scoreCls: "role-card__score" + (nd === nCat && nCat ? " is-full" : nd === 0 ? " is-empty" : ""),
        				segments: self.catalogue.map(function (d) {
        					var on = dr.indexOf(d.code) >= 0;
        					return { cls: "role-card__seg" + (on ? " is-on" : ""), titre: d.libelle + (on ? " : oui" : " : non") };
        				}),
        				droitsTxt: nd === 0 ? "Aucun droit accordé" : nd === nCat ? "Tous les droits" : nd + " droit" + (nd > 1 ? "s" : "") + " sur " + nCat,
        				membresTxt: String(nm),
        				membresCls: "role-card__count" + (nm === 0 ? " is-empty" : ""),
        				stack: membres.slice(0, 6),
        				more: nm > 6 ? "+" + (nm - 6) : ""
        			};
        		});
        		this.matrice = this.catalogue.map(function (d) {
        			return {
        				libelle: d.libelle,
        				description: d.description,
        				cells: (self.roles || []).map(function (r) { return { has: self.droitsDe(r.code).indexOf(d.code) >= 0 }; })
        			};
        		});
        		var sans = (this.lignes || []).filter(function (l) { return self.onFlag(l.actif == null ? "true" : l.actif) && !l.codeRole; });
        		this.sansRoleTexte = sans.length ? sans.length + " collaborateur(s) actif(s) sans rôle : " + sans.map(function (l) { return l.libelle || l.cle; }).join(", ") + ". " : "";
        		this.rafraichir();
        	}
        	monRole() {
        		var cle = String(this.cleActeur || "");
        		var i;
        		for (i = 0; i < (this.lignes || []).length; i++) {
        			var l = this.lignes[i];
        			if (String(l.cle) === cle || String(l.cleExterne || "").toUpperCase() === cle.toUpperCase()) return String(l.codeRole || "");
        		}
        		return "";
        	}
        	ouvrirRole(code) {
        		var self = this;
        		var r = null;
        		(this.roles || []).forEach(function (x) { if (String(x.code) === String(code)) r = x; });
        		this.draftIsNew = !r;
        		this.draftCode = r ? String(r.code) : "";
        		this.draftLibelle = r ? String(r.libelle || "") : "";
        		var droits = r ? this.droitsDe(r.code) : [];
        		this.initDroits = droits.join(",");
        		this.draftDroits = {};
        		droits.forEach(function (c) { self.draftDroits[c] = true; });
        		this.draftMembres = r ? this.membresDe(r.code) : [];
        		this.drawerEyebrow = r ? "Rôle" : "Nouveau rôle";
        		this.drawerTitle = r ? (r.libelle || r.code) : "Créer un rôle";
        		this.drawerSub = r ? (this.draftMembres.length + " collaborateur(s) · " + droits.length + " droit(s)") : "Choisissez les droits accordés aux collaborateurs qui auront ce rôle.";
        		this.codeHint = r ? "Non modifiable." : "Majuscules, chiffres et _.";
        		this.drawerMsg = "";
        		this.majChecks();
        		this.drawerOn = true;
        		this.drawerShown = false;
        		this.rafraichir();
        		setTimeout(function () { self.drawerShown = true; self.rafraichir(); }, 20);
        	}
        	droitsCoches() {
        		var self = this;
        		return this.catalogue.map(function (d) { return d.code; }).filter(function (c) { return !!self.draftDroits[c]; });
        	}
        	estMonRole() { return !this.draftIsNew && this.monRole() === this.draftCode; }
        	majChecks() {
        		var self = this;
        		this.checks = this.catalogue.map(function (d) {
        			var on = !!self.draftDroits[d.code];
        			return { code: d.code, libelle: d.libelle, description: d.description, on: on, cls: "check-card" + (on ? " is-checked" : "") };
        		});
        		var coches = this.droitsCoches();
        		this.warnTexte = "";
        		this.warnCls = "";
        		if (this.estMonRole() && coches.indexOf("GERER_REFERENTIEL") < 0) {
        			this.warnTexte = "C''est votre rôle : sans « Gérer le référentiel », vous perdrez l''accès à cette administration.";
        			this.warnCls = "callout callout--danger";
        		} else if (!this.draftIsNew && this.draftMembres.length && coches.slice().sort().join(",") !== this.initDroits) {
        			this.warnTexte = this.draftMembres.length + " collaborateur(s) verront leurs droits modifiés dès l''enregistrement.";
        			this.warnCls = "callout callout--warning";
        		}
        	}
        	basculerDroit(code) {
        		this.draftDroits[code] = !this.draftDroits[code];
        		this.majChecks();
        		this.rafraichir();
        	}
        	setLibelle(event) {
        		var t = event && event.target ? event.target : null;
        		this.draftLibelle = t ? String(t.value || "") : String(event || "");
        		if (this.draftIsNew) this.draftCode = this.codeDepuis(this.draftLibelle);
        	}
        	codeDepuis(libelle) {
        		var s = String(libelle || "");
        		try { s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); } catch (e) {}
        		return s.toUpperCase().replace(/[^A-Z0-9]+/g, "_").replace(/^_+|_+$/g, "").substring(0, 30);
        	}
        	setCode(event) {
        		var t = event && event.target ? event.target : null;
        		var v = String(t ? t.value : (event || "")).toUpperCase().replace(/[^A-Z0-9_]/g, "");
        		this.draftCode = v;
        		if (t && t.value !== v) t.value = v;
        	}
        	fermer() {
        		var self = this;
        		this.drawerShown = false;
        		this.rafraichir();
        		setTimeout(function () { self.drawerOn = false; self.rafraichir(); }, 250);
        	}
        	sauver() {
        		var self = this;
        		var code = String(this.draftCode || "").trim();
        		var libelle = String(this.draftLibelle || "").trim();
        		this.drawerMsg = "";
        		if (!libelle) { this.drawerMsg = "Le libellé est obligatoire."; this.rafraichir(); return; }
        		if (!code) { this.drawerMsg = "Le libellé doit contenir au moins une lettre ou un chiffre."; this.rafraichir(); return; }
        		if (this.draftIsNew && (this.roles || []).some(function (r) { return String(r.code) === code; })) { this.drawerMsg = "Un rôle avec ce libellé existe déjà."; this.rafraichir(); return; }
        		var coches = this.droitsCoches();
        		if (this.estMonRole() && coches.indexOf("GERER_REFERENTIEL") < 0) {
        			if (!window.confirm("Retirer votre accès à l''administration ? Après l''enregistrement, vous ne pourrez plus revenir sur cet écran.")) return;
        		}
        		this.appel("Role_Enregistrer", { cleActeur: this.cleActeur, code: code, libelle: libelle, droits: coches.join(",") }).then(function (out) {
        			var d = self.doc(out);
        			var raw: any = out;
        			var res = (raw && raw.resultat) || (d && d.resultat) || {};
        			var e = (raw && raw.error) || (d && d.error) || null;
        			if (e || String(res.ok) !== "true") {
        				var em = e ? (typeof e === "string" ? e : (e.message || e.text || "")) : (res.message || "");
        				self.drawerMsg = "Enregistrement impossible" + (em ? " : " + em : ".");
        				self.rafraichir();
        				return;
        			}
        			self.message = "Rôle « " + libelle + " » enregistré.";
        			self.fermer();
        			self.charger();
        		}, function () {
        			self.drawerMsg = "Enregistrement impossible.";
        			self.rafraichir();
        		});
        	}
        	supprimer() {
        		var self = this;
        		var code = String(this.draftCode || "");
        		var libelle = String(this.draftLibelle || code);
        		if (!code || this.draftIsNew) return;
        		this.drawerMsg = "";
        		var nm = (this.draftMembres || []).length;
        		if (nm > 0) {
        			this.drawerMsg = "Ce rôle est encore attribué à " + nm + " collaborateur" + (nm > 1 ? "s" : "") + ". Changez leur rôle avant de le supprimer.";
        			this.rafraichir();
        			return;
        		}
        		if (!window.confirm("Supprimer le rôle « " + libelle + " » ? Cette action est définitive.")) return;
        		this.appel("Role_Supprimer", { cleActeur: this.cleActeur, code: code }).then(function (out) {
        			var raw: any = out;
        			var res = (raw && raw.resultat) || {};
        			var e = (raw && raw.error) || null;
        			if (e || String(res.ok) !== "true") {
        				var em = e ? (typeof e === "string" ? e : (e.message || e.text || "")) : (res.message || "");
        				self.drawerMsg = "Suppression impossible" + (em ? " : " + em : ".");
        				self.rafraichir();
        				return;
        			}
        			self.message = "Rôle « " + libelle + " » supprimé.";
        			self.fermer();
        			self.charger();
        		}, function () {
        			self.drawerMsg = "Suppression impossible.";
        			self.rafraichir();
        		});
        	}
        	voirSansRole() {
        		try { window.sessionStorage.setItem("pfc:preset", "role"); } catch (e) {}
        		this.routerProvider.navigateRoot("Collaborateurs", false, null);
        	}
        	navSidebar(event) {
        		var code = event;
        		if (code && code.route) code = code.route;
        		if (code && code.detail != null) code = code.detail;
        		code = String(code || "");
        		if (code.indexOf("logout") >= 0) { this.deconnecter(); return; }
        		if (code === "roles") return;
        		if (code === "lignes") { this.routerProvider.navigateRoot("Collaborateurs", false, null); return; }
        		if (code === "projets") { this.routerProvider.navigateRoot("Projets", false, null); return; }
        		try { window.sessionStorage.setItem("pfc:vue", code === "grille" ? "grille" : code); } catch (e) {}
        		if (code === "dashboard-v2") {
        			try { window.sessionStorage.setItem("pfc:tdb", "v2"); } catch (eV) {}
        			this.routerProvider.navigateRoot("TableauDeBord", false, null);
        			return;
        		}
        		if (code === "dashboard") this.routerProvider.navigateRoot("TableauDeBord", false, null);
        		else this.routerProvider.navigateRoot("PlanDeCharge", false, null);
        	}
        	deconnecter() {
        		try { window.sessionStorage.removeItem("pfc:userName"); window.sessionStorage.removeItem("pfc:userRole"); window.sessionStorage.removeItem("pfc:canAdmin"); } catch (eL) {}
        		var so = this.routerProvider && this.routerProvider.sharedObject;
        		if (so) { so.user = null; so.isConnected = false; }
        		this.routerProvider.navigateRoot("Login", false, null);
        	}
        /*End_c8o_PageFunction*/
