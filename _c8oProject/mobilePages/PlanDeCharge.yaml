        		var data = this.pfAffectPending;
        		if (!data || (this.view && this.view !== "grille")) return;
        		if (!this.rows || !this.rows.length) return;
        		if ((!this.elements || !this.elements.length) && (!this.types || !this.types.length)) return;
        		this.pfAffectPending = null;
