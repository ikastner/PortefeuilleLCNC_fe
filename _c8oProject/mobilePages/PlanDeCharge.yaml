      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	view: string;
        	cleActeur: string;
        	dateFrom: string;
        	dateTo: string;
        	dayCount: number;
        	today: string;
        	rows: any[];
        	items: any[];
        	holidays: any;
        	typeLabels: any;
        	typeStyles: any;
        	gridLabels: any;
        	droits: string[];
        	elements: any[];
        	types: any[];
        	profils: any[];
        	porteurs: any[];
        	roles: any[];
        	roleDroits: any[];
        	etapes: any[];
        	suivi: any[];
        	coefficients: any[];
        	scores: any[];
        	messages: any[];
        	message: string;
        	modal: string;
        	saisie: any;
        	chargeFrom: string;
        	chargeTo: string;
        	selection: any;
        	commentPortee: string;
        	commentBody: string;
        	mentions: string[];
        	mentionTous: boolean;
        	canEdit: boolean;
        	canAdmin: boolean;
        	boForm: any;
        	loading: boolean;
        /*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        /*End_c8o_PageConstructor*/
        /*Begin_c8o_PageInitialization*/
        		this.pfcInit();
        /*End_c8o_PageInitialization*/
        /*Begin_c8o_PageFunction*/
        	pfcInit() {
        		if (this.view) return;
        		this.view = "grille";
        		this.modal = "";
        		this.rows = [];
        		this.items = [];
        		this.holidays = {};
        		this.droits = [];
        		this.elements = [];
        		this.types = [];
        		this.profils = [];
        		this.porteurs = [];
        		this.roles = [];
        		this.roleDroits = [];
        		this.etapes = [];
        		this.suivi = [];
        		this.coefficients = [];
        		this.scores = [];
        		this.messages = [];
        		this.mentions = [];
        		this.mentionTous = false;
        		this.commentBody = "";
        		this.commentPortee = "JOUR";
        		this.saisie = {};
        		this.boForm = {};
        		this.selection = null;
        		this.message = "";
        		this.canEdit = false;
        		this.canAdmin = false;
        		this.loading = false;
        		this.gridLabels = { add: "Affecter", today: "Aujourd" + String.fromCharCode(39) + "hui" };
        		this.typeLabels = { PROJET: "Projet", OFF: "OFF", ABSENCE: "Absence" };
        		this.typeStyles = {
        			PROJET: { bg: "#dbe7ff", color: "#1a428a", border: "#1a428a" },
        			OFF: { bg: "#eceff3", color: "#495057", border: "#6c757d" },
        			ABSENCE: { bg: "#fff4e6", color: "#c97a1e", border: "#ed6c02" }
        		};
        		try { this.cleActeur = localStorage.getItem("pfcCleActeur") || ""; } catch (e) { this.cleActeur = ""; }
        		this.fixTrimestre();
        		this.chargerReferentiel();
        		this.chargerGrille();
        	}
        	refresh() {
        		try { this.ref.detectChanges(); } catch (e) {}
        	}
        	iso(d) {
        		var m = String(d.getMonth() + 1);
        		var day = String(d.getDate());
        		if (m.length < 2) m = "0" + m;
        		if (day.length < 2) day = "0" + day;
        		return d.getFullYear() + "-" + m + "-" + day;
        	}
        	fixTrimestre() {
        		var d = new Date();
        		var q = Math.floor(d.getMonth() / 3);
        		var start = new Date(d.getFullYear(), q * 3, 1);
        		var end = new Date(d.getFullYear(), q * 3 + 3, 0);
        		this.dateFrom = this.iso(start);
        		this.dateTo = this.iso(end);
        		this.today = this.iso(d);
        		this.dayCount = 96;
        	}
        	nomActeur() {
        		var i;
        		for (i = 0; i < (this.rows || []).length; i++) {
        			if (String(this.rows[i].id) === String(this.cleActeur)) return this.rows[i].name;
        		}
        		return this.cleActeur || "aucun acteur";
        	}
        	periodeLabel() {
        		return (this.dateFrom || "") + " → " + (this.dateTo || "");
        	}
        	has(code) {
        		return (this.droits || []).indexOf(code) >= 0;
        	}
        	asList(v) {
        		if (v == null) return [];
        		if (Object.prototype.toString.call(v) === "[object Array]") return v;
        		if (v.row != null) return this.asList(v.row);
        		return [v];
        	}
        	doc(out) {
        		if (!out) return {};
        		if (out.document) return out.document;
        		if (out.transaction) {
        			var list = this.asList(out.transaction);
        			var i;
        			for (i = 0; i < list.length; i++) {
        				var d = list[i].document || list[i];
        				if (d && d.error) return d;
        			}
        		}
        		return out;
        	}
        	appel(seq, vars): any {
        		var args = ["PortefeuilleLCNC_be." + seq];
        		var k;
        		vars = vars || {};
        		for (k in vars) {
        			if (Object.prototype.hasOwnProperty.call(vars, k)) {
        				args.push(k);
        				args.push(vars[k] == null ? "" : String(vars[k]));
        			}
        		}
        		var p = this.c8o.callJson.apply(this.c8o, args);
        		return new Promise(function(ok, ko) {
        			p.then(function(out) { ok(out); return p; });
        			if (p.fail) p.fail(function(err) { ko(err); });
        		});
        	}
        	setActor(event) {
        		var v = "";
        		if (event && event.target && event.target.value != null) v = String(event.target.value);
        		else if (event && event.detail && event.detail.value != null) v = String(event.detail.value);
        		this.cleActeur = v.trim();
        		try { localStorage.setItem("pfcCleActeur", this.cleActeur); } catch (e) {}
        		this.chargerGrille();
        	}
        	setBo(event, key) {
        		var v = "";
        		if (event && event.target && event.target.value != null) v = String(event.target.value);
        		else if (event && event.detail && event.detail.value != null) v = String(event.detail.value);
        		if (!this.boForm) this.boForm = {};
        		this.boForm[key] = v;
        	}
        	setComment(event) {
        		var v = "";
        		if (event && event.target && event.target.value != null) v = String(event.target.value);
        		else if (event && event.detail && event.detail.value != null) v = String(event.detail.value);
        		this.commentBody = v;
        	}
        	setNote(event) {
        		var v = "";
        		if (event && event.target && event.target.value != null) v = String(event.target.value);
        		else if (event && event.detail && event.detail.value != null) v = String(event.detail.value);
        		this.saisie.commentaire = v;
        	}
        	ouvrir(vue) {
        		this.view = vue;
        		this.modal = "";
        		if (vue === "grille") this.chargerGrille();
        		if (vue === "projets" || vue === "lignes" || vue === "roles") this.chargerReferentiel();
        		if (vue === "suivi") this.chargerSuivi();
        		if (vue === "mvp") this.chargerMvp();
        		this.refresh();
        	}
        	payload(event) {
        		if (!event) return {};
        		var inner = event.event;
        		if (inner && (inner.rowId || inner.eventId || inner.dateFrom || inner.orderedIds || inner.dateDebut)) return inner;
        		return event;
        	}
        	onVisible(event) {
        		var p = this.payload(event);
        		if (!p.dateFrom || !p.dateTo) return;
        		if (p.dateFrom === this.chargeFrom && p.dateTo === this.chargeTo) return;
        		this.chargeFrom = p.dateFrom;
        		this.chargeTo = p.dateTo;
        		this.chargerGrille();
        	}
        	onCreate(event) {
        		if (!this.canEdit) { this.message = "Droit MODIFIER_AFFECTATION requis."; this.refresh(); return; }
        		var p = this.payload(event);
        		this.saisie = { cleLigne: p.rowId, dateFrom: p.dateDebut, dateTo: p.dateFin, codeType: "PROJET", libelleElement: "", periode: "JOURNEE", commentaire: "" };
        		this.modal = "affect";
        		this.refresh();
        	}
        	onEvent(event) {
        		var p = this.payload(event);
        		var found = null;
        		var i;
        		for (i = 0; i < this.items.length; i++) {
        			if (String(this.items[i].id) === String(p.eventId)) found = this.items[i];
        		}
        		this.selection = found || { id: p.eventId, start: p.date, period: p.period };
        		this.modal = "delete";
        		this.refresh();
        	}
        	onOrder(event) {
        		var p = this.payload(event);
        		var ids = p.orderedIds || [];
        		var self = this;
        		var chain = Promise.resolve();
        		ids.forEach(function(id, index) {
        			chain = chain.then(function() {
        				return new Promise(function(ok) {
        					self.appel("Jour_Ordonner", { cleActeur: self.cleActeur, idJour: String(id), ordre: String(index) }).then(function() { ok(null); });
        				});
        			});
        		});
        		chain.then(function() { self.chargerGrille(); });
        	}
        	onComment(event) {
        		var p = this.payload(event);
        		var found = null;
        		var i;
        		for (i = 0; i < this.items.length; i++) {
        			if (String(this.items[i].id) === String(p.eventId)) found = this.items[i];
        		}
        		this.selection = found;
        		this.commentPortee = "JOUR";
        		this.commentBody = "";
        		this.mentions = [];
        		this.mentionTous = false;
        		this.modal = "comment";
        		this.chargerFil();
        	}
        	fermer() { this.modal = ""; this.refresh(); }
        	setType(code) { this.saisie.codeType = code; if (code !== "PROJET") this.saisie.libelleElement = ""; this.refresh(); }
        	setPeriode(code) { this.saisie.periode = code; this.refresh(); }
        	choisirProjet(event) {
        		var lib = event && event.currentTarget ? event.currentTarget.getAttribute("data-libelle") : "";
        		this.saisie.libelleElement = lib || "";
        		this.saisie.codeType = "PROJET";
        		this.refresh();
        	}
        	enregistrerAffect() {
        		var self = this;
        		var f = this.saisie || {};
        		this.appel("Jour_Enregistrer", {
        			cleActeur: this.cleActeur, cleLigne: f.cleLigne, codeType: f.codeType,
        			libelleElement: f.codeType === "PROJET" ? f.libelleElement : "",
        			dateFrom: f.dateFrom, dateTo: f.dateTo, periode: f.periode, commentaire: f.commentaire || ""
        		}).then(function(out) {
        			if (self.okOf(out)) { self.modal = ""; self.chargerGrille(); }
        			else self.refresh();
        		});
        	}
        	supprimerPastille() {
        		var self = this;
        		var s = this.selection || {};
        		this.appel("Jour_Supprimer", {
        			cleActeur: this.cleActeur, cleLigne: s.rowId, jour: s.start, periode: s.period || "JOURNEE"
        		}).then(function(out) {
        			if (self.okOf(out)) { self.modal = ""; self.chargerGrille(); }
        			else self.refresh();
        		});
        	}
        	okOf(out) {
        		var d = this.doc(out);
        		var r = d.resultat || d;
        		if (r.ok == null && d.error) { this.message = String(d.error.message || d.error); return false; }
        		var ok = r.ok === true || String(r.ok) === "true" || String(r.ok) === "t";
        		this.message = r.message ? String(r.message) : (ok ? "Enregistre." : "Action refusee.");
        		return ok;
        	}
        	canCommentJour() {
        		if (!this.selection) return false;
        		var own = String(this.selection.rowId) === String(this.cleActeur);
        		if (own) return this.has("COMMENTER_JOUR_SOI") || this.has("COMMENTER_JOUR_AUTRUI");
        		return this.has("COMMENTER_JOUR_AUTRUI");
        	}
        	canSend() {
        		if (this.commentPortee === "ELEMENT") return this.has("COMMENTER_PROJET");
        		return this.canCommentJour();
        	}
        	ouvrirFilProjet() {
        		this.commentPortee = "ELEMENT";
        		this.chargerFil();
        	}
        	ouvrirFilJour() {
        		this.commentPortee = "JOUR";
        		this.chargerFil();
        	}
        	chargerFil() {
        		var self = this;
        		var s = this.selection || {};
        		var projet = s.type === "PROJET";
        		this.appel("Commentaire_Lire", {
        			portee: this.commentPortee,
        			cleLigne: s.rowId || "",
        			jour: s.start || "",
        			libelleElement: projet ? (s.label || "") : "",
        			codeType: projet ? "" : (s.type || "")
        		}).then(function(out) {
        			self.messages = self.asList(self.doc(out).messages);
        			self.refresh();
        		});
        	}
        	ajouterMention(event) {
        		var cle = event && event.currentTarget ? event.currentTarget.getAttribute("data-cle") : "";
        		if (!cle) return;
        		if (this.mentions.indexOf(cle) < 0) this.mentions.push(cle);
        		this.refresh();
        	}
        	basculerTous() { this.mentionTous = !this.mentionTous; this.refresh(); }
        	envoyerCommentaire() {
        		if (!this.canSend()) { this.message = "Droit de commentaire insuffisant."; this.refresh(); return; }
        		var self = this;
        		var s = this.selection || {};
        		var projet = s.type === "PROJET" || this.commentPortee === "ELEMENT";
        		this.appel("Commentaire_Ajouter", {
        			cleActeur: this.cleActeur,
        			portee: this.commentPortee,
        			cleLigne: s.rowId || "",
        			jour: this.commentPortee === "JOUR" ? (s.start || "") : "",
        			libelleElement: projet ? (s.label || "") : "",
        			codeType: projet ? "" : (s.type || ""),
        			corps: this.commentBody || "",
        			idParent: "",
        			mentions: (this.mentions || []).join(","),
        			tous: this.mentionTous ? "true" : "false"
        		}).then(function(out) {
        			if (self.okOf(out)) {
        				self.commentBody = "";
        				self.mentions = [];
        				self.mentionTous = false;
        				self.chargerFil();
        				self.chargerGrille();
        			} else self.refresh();
        		});
        	}
        	chargerGrille() {
        		var self = this;
        		this.loading = true;
        		this.appel("Grille_Lire", { dateFrom: this.chargeFrom || this.dateFrom, dateTo: this.chargeTo || this.dateTo, cleActeur: this.cleActeur }).then(function(out) {
        			var d = self.doc(out);
        			if (d.error) {
        				self.rows = [];
        				self.items = [];
        				self.loading = false;
        				self.message = String((d.error && d.error.message) || d.error);
        				self.refresh();
        				return;
        			}
        			self.rows = self.asList(d.rows);
        			self.items = self.asList(d.items);
        			var feries = self.asList(d.feries);
        			var map = {};
        			var i;
        			for (i = 0; i < feries.length; i++) {
        				if (feries[i].jour) map[String(feries[i].jour)] = String(feries[i].libelle || "");
        			}
        			self.holidays = map;
        			self.droits = self.asList(d.droits).map(function(x) {
        				if (typeof x === "string") return x;
        				return String(x.code_droit || x.codeDroit || x.value || "");
        			}).filter(function(x) { return x; });
        			self.canEdit = self.has("MODIFIER_AFFECTATION");
        			self.canAdmin = self.has("GERER_REFERENTIEL");
        			self.loading = false;
        			self.refresh();
        		}, function(err) {
        			self.loading = false;
        			self.message = String((err && err.message) || err);
        			self.refresh();
        		});
        	}
        	chargerReferentiel() {
        		var self = this;
        		this.appel("Referentiel_Lire", {}).then(function(out) {
        			var d = self.doc(out);
        			self.profils = self.asList(d.profils);
        			self.types = self.asList(d.types);
        			self.elements = self.asList(d.elements);
        			self.porteurs = self.asList(d.porteurs);
        			self.etapes = self.asList(d.etapes);
        			self.roles = self.asList(d.roles);
        			self.roleDroits = self.asList(d.roleDroits);
        			var labels = { PROJET: "Projet", OFF: "OFF", ABSENCE: "Absence" };
        			var styles = {
        				PROJET: { bg: "#dbe7ff", color: "#1a428a", border: "#1a428a" },
        				OFF: { bg: "#eceff3", color: "#495057", border: "#6c757d" },
        				ABSENCE: { bg: "#fff4e6", color: "#c97a1e", border: "#ed6c02" }
        			};
        			var i;
        			for (i = 0; i < self.types.length; i++) {
        				var t = self.types[i];
        				if (!t.code) continue;
        				labels[t.code] = t.libelle || t.code;
        				if (t.couleurFond) styles[t.code] = { bg: t.couleurFond, color: t.couleurTexte || "#1a428a", border: t.couleurBord || t.couleurFond };
        			}
        			self.typeLabels = labels;
        			self.typeStyles = styles;
        			self.refresh();
        		});
        	}
        	chargerSuivi() {
        		var self = this;
        		this.appel("Suivi_Lire", {}).then(function(out) {
        			self.suivi = self.asList(self.doc(out).suivi);
        			self.refresh();
        		});
        	}
        	chargerMvp() {
        		var self = this;
        		this.appel("Mvp_Lire", {}).then(function(out) {
        			var d = self.doc(out);
        			self.coefficients = self.asList(d.coefficients);
        			self.scores = self.asList(d.scores);
        			self.refresh();
        		});
        	}
        	choisirElement(event) {
        		var code = event && event.currentTarget ? event.currentTarget.getAttribute("data-code") : "";
        		var found = null;
        		var i;
        		for (i = 0; i < this.elements.length; i++) if (this.elements[i].code === code) found = this.elements[i];
        		var ports = [];
        		for (i = 0; i < this.porteurs.length; i++) {
        			if (this.porteurs[i].codeElement === code) ports.push((this.porteurs[i].codeAgent || "") + "|" + (this.porteurs[i].libelle || ""));
        		}
        		this.boForm = found ? { code: found.code, libelle: found.libelle, lcNc: found.lcNc, statutCatalogue: found.statutCatalogue, couleur: found.couleur, actif: found.actif, porteurs: ports.join(";") } : { code: code };
        		this.refresh();
        	}
        	sauverElement() {
        		var self = this;
        		var f = this.boForm || {};
        		this.appel("Element_Enregistrer", {
        			cleActeur: this.cleActeur, code: f.code || "", libelle: f.libelle || "", couleur: f.couleur || "",
        			actif: f.actif === "false" ? "false" : "true", lcNc: f.lcNc || "", statutCatalogue: f.statutCatalogue || ""
        		}).then(function(out) { self.okOf(out); self.chargerReferentiel(); });
        	}
        	sauverPorteurs() {
        		var self = this;
        		var f = this.boForm || {};
        		this.appel("Porteur_Remplacer", { cleActeur: this.cleActeur, code: f.code || "", porteurs: f.porteurs || "" }).then(function(out) {
        			self.okOf(out); self.chargerReferentiel();
        		});
        	}
        	sauverProfil() {
        		var self = this;
        		var f = this.boForm || {};
        		this.appel("Profil_Enregistrer", { cleActeur: this.cleActeur, code: f.code || "", libelle: f.libelle || "", ordre: f.ordre || "0" }).then(function(out) {
        			self.okOf(out); self.chargerReferentiel();
        		});
        	}
        	sauverLigne() {
        		var self = this;
        		var f = this.boForm || {};
        		this.appel("Ligne_Enregistrer", {
        			cleActeur: this.cleActeur, cle: f.cle || "", cleExterne: f.cleExterne || "", codeProfil: f.codeProfil || "",
        			couleur: f.couleur || "", ordre: f.ordre || "0", actif: f.actif === "false" ? "false" : "true"
        		}).then(function(out) { self.okOf(out); self.chargerReferentiel(); self.chargerGrille(); });
        	}
        	toggleDroit(code) {
        		var bag = ((this.boForm && this.boForm.droits) || "").split(",").filter(function(x) { return x; });
        		var i = bag.indexOf(code);
        		if (i >= 0) bag.splice(i, 1); else bag.push(code);
        		if (!this.boForm) this.boForm = {};
        		this.boForm.droits = bag.join(",");
        		this.refresh();
        	}
        	sauverRole() {
        		var self = this;
        		var f = this.boForm || {};
        		this.appel("Role_Enregistrer", { cleActeur: this.cleActeur, code: f.code || "", libelle: f.libelle || "", droits: f.droits || "" }).then(function(out) {
        			self.okOf(out); self.chargerReferentiel();
        		});
        	}
        	affecterRole() {
        		var self = this;
        		var f = this.boForm || {};
        		this.appel("LigneRole_Affecter", { cleActeur: this.cleActeur, cleLigne: f.cleLigne || "", codeRole: f.codeRole || "" }).then(function(out) {
        			self.okOf(out); self.chargerGrille();
        		});
        	}
        	sauverSuivi() {
        		var self = this;
        		var f = this.boForm || {};
        		this.appel("Suivi_Enregistrer", { cleActeur: this.cleActeur, codeElement: f.codeElement || "", codeEtape: f.codeEtape || "", valeur: f.valeur || "" }).then(function(out) {
        			self.okOf(out); self.chargerSuivi();
        		});
        	}
        	sauverMvp() {
        		var self = this;
        		var f = this.boForm || {};
        		this.appel("Mvp_Enregistrer", { cleActeur: this.cleActeur, cleLigne: f.cleLigne || "", codeElement: f.codeElement || "", coefficient: f.coefficient || "0" }).then(function(out) {
        			self.okOf(out); self.chargerMvp();
        		});
        	}
        	chargerFeries() {
        		var self = this;
        		var annee = (this.dateFrom || "2026").substring(0, 4);
        		this.appel("JourFerie_Charger", { annee: annee }).then(function(out) {
        			self.okOf(out); self.chargerGrille();
        		});
        	}
        /*End_c8o_PageFunction*/'
