        	pfaAdmin(): any {
        		return (window as any).PfaAdmin;
        	}
        	pfaSyncChrome() {
        		var nom = "";
        		this.pfaUserName = this.nomBarre();
        		this.pfaUserRole = this.libelleRole();
        		if (this.pfaUserRole) {
        			try { window.sessionStorage.setItem("pfc:userRole", this.pfaUserRole); } catch (eRole) {}
        		}
        		var els = this.elements || [];
        		var lig = this.lignes || [];
        		var ports = this.participants || [];
        		var projets = 0;
        		var gens = 0;
        		var seen = {};
        		var seenL = {};
        		var i;
        		var j;
        		for (i = 0; i < els.length; i++) {
        			var el = els[i];
        			var actif = String(el.actif == null ? "true" : el.actif).toLowerCase();
        			if (actif === "false" || actif === "f" || actif === "0") continue;
        			var hasP = false;
        			for (j = 0; j < ports.length; j++) if (ports[j].codeElement === el.code) hasP = true;
        			if (!el.chefProjet || !hasP) {
        				if (!seen[el.code]) { seen[el.code] = 1; projets++; }
        			}
        		}
        		for (i = 0; i < lig.length; i++) {
        			var l = lig[i];
        			var la = String(l.actif == null ? "true" : l.actif).toLowerCase();
        			if (la === "false" || la === "f" || la === "0") continue;
        			if (!l.referent || !l.codeRole) {
        				if (!seenL[l.cle]) { seenL[l.cle] = 1; gens++; }
        			}
        		}
        		this.badgeProjets = projets;
        		this.badgeLignes = gens;
        	}
        	rafraichir() {
        		try { this.ref.detectChanges(); } catch (e) {}
        	}
        	refresh() {
        		this.pfaSyncChrome();
        		try { var admin = this.pfaAdmin(); if (admin) admin.paint(this); } catch (e2) {}
        		this.rafraichir();
        	}
        	pfaBoot() {
        		var self = this;
        		var assets = this.c8o.endpointConvertigo + "/projects/PortefeuilleLCNC_fe/DisplayObjects/mobile/assets/";
        		if (!document.getElementById("pfa-admin-css")) {
        			var link = document.createElement("link");
        			link.id = "pfa-admin-css";
        			link.rel = "stylesheet";
        			link.href = assets + "css/pfa-admin.css?v=admin3";
        			document.head.appendChild(link);
        		}
        		if (document.getElementById("pfa-admin-js")) {
        			var deja = this.pfaAdmin();
        			if (deja) deja.boot(this);
        			return;
        		}
        		var script = document.createElement("script");
        		script.id = "pfa-admin-js";
        		script.src = assets + "js/pfa-admin.js?v=admin4";
        		script.onload = function() { var charge = self.pfaAdmin(); if (charge) charge.boot(self); };
        		document.head.appendChild(script);
        	}
        	pfaNav(event) {
        		var code = event;
        		if (code && code.route) code = code.route;
        		if (code && code.detail != null) code = code.detail;
        		code = String(code || "");
        		if (code.indexOf("logout") >= 0) { this.deconnecter(); return; }
        		if (code === "feries") { this.chargerFeries(); return; }
        		if (code && code !== "undefined") this.ouvrir(code);
        	}
        	pfaOnClick(event) {
        		var admin = this.pfaAdmin();
        		var dom = event;
        		if (event && event.root && event.root.out) dom = event.root.out;
        		else if (event && event.target) dom = event;
        		else if (event && event.event) dom = event.event;
        		if (admin && admin.click) admin.click(this, dom);
        	}
        	iso(d) {
        		var m = String(d.getMonth() + 1);
        		var day = String(d.getDate());
        		if (m.length < 2) m = "0" + m;
        		if (day.length < 2) day = "0" + day;
        		return d.getFullYear() + "-" + m + "-" + day;
        	}
        	monday(offset) {
        		var d = new Date();
        		d.setHours(0, 0, 0, 0);
        		var dow = d.getDay();
        		d.setDate(d.getDate() + (dow === 0 ? 1 : dow === 6 ? 2 : 1 - dow) + offset * 7);
        		return d;
        	}
        	genTrimestres(anneesAvant, anneesApres) {
        		var y0 = new Date().getFullYear();
        		var out = [];
        		var y;
        		var q;
        		for (y = y0 - anneesAvant; y <= y0 + anneesApres; y++) {
        			for (q = 1; q <= 4; q++) {
        				out.push({ value: String(y) + "-" + String(q), label: String(q) + "T " + String(y) });
        			}
        		}
        		return out;
        	}
        	lireTrimestres() {
        		var opts = this.trimestreOpts || [];
        		try {
        			var raw = window.sessionStorage.getItem("pfc:trimestres");
        			var list = raw ? JSON.parse(raw) : [];
        			if (!Array.isArray(list)) return [];
        			return list.map(function(v) { return String(v); }).filter(function(v) {
        				return opts.some(function(o) { return o.value === v; });
        			});
        		} catch (e) {
        			return [];
        		}
        	}
        	memoriserTrimestres(sel) {
        		try {
        			if (sel && sel.length) window.sessionStorage.setItem("pfc:trimestres", JSON.stringify(sel));
        			else window.sessionStorage.removeItem("pfc:trimestres");
        		} catch (e) {}
        	}
        	écrireQfqDeepLink(opts) {
        		try {
        			if (opts.periodFrom) window.sessionStorage.setItem("pfc:qfq:periodFrom", opts.periodFrom);
        			if (opts.periodTo) window.sessionStorage.setItem("pfc:qfq:periodTo", opts.periodTo);
        			if (opts.focusDay) window.sessionStorage.setItem("pfc:qfq:focusDay", opts.focusDay);
        			else window.sessionStorage.removeItem("pfc:qfq:focusDay");
        			if (opts.focusEl) window.sessionStorage.setItem("pfc:qfq:focusEl", opts.focusEl);
        			else window.sessionStorage.removeItem("pfc:qfq:focusEl");
        			if (opts.scroll) window.sessionStorage.setItem("pfc:qfq:scroll", opts.scroll);
        			else window.sessionStorage.removeItem("pfc:qfq:scroll");
        		} catch (e) {}
        	}
        	lireEtConsommerQfqDeepLink() {
        		try {
        			var from = window.sessionStorage.getItem("pfc:qfq:periodFrom");
        			var to = window.sessionStorage.getItem("pfc:qfq:periodTo");
        			var focusDay = window.sessionStorage.getItem("pfc:qfq:focusDay");
        			var focusEl = window.sessionStorage.getItem("pfc:qfq:focusEl");
        			var scroll = window.sessionStorage.getItem("pfc:qfq:scroll");
        			["pfc:qfq:periodFrom","pfc:qfq:periodTo","pfc:qfq:focusDay","pfc:qfq:focusEl","pfc:qfq:scroll"]
        				.forEach(function (k) { window.sessionStorage.removeItem(k); });
        			if (!from && !to && !focusDay && !focusEl && !scroll) return null;
        			if (from && to && from > to) return null;
        			return { periodFrom: from || undefined, periodTo: to || undefined,
        				focusDay: focusDay || undefined, focusEl: focusEl || undefined, scroll: scroll || undefined };
        		} catch (e) { return null; }
        	}
        	weekDays(offset) {
        		var l = this.monday(offset);
        		var noms = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi"];
        		return noms.map(function (_, i) { var d = new Date(l); d.setDate(l.getDate() + i); return d; });
