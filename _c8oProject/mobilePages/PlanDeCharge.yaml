          .ais-doc-h2{display:block;margin:0 0 12px;font-size:18px;font-weight:700;color:#1A428A}
          .ais-doc-h3{display:block;margin:18px 0 8px;font-size:15px;font-weight:700;color:#1A428A}
          .ais-doc-text{display:block;margin:4px 0;font-size:14px;line-height:1.45;color:#333}
          .ais-doc-value,.tad-ds-code{display:block;margin:2px 0 10px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e2e8f0;background:#1e293b;padding:14px 16px;border-radius:8px;white-space:pre-wrap;word-break:break-word}
          @media (max-width:720px){.tad-preview{padding:16px}}
          .pgp-title{margin:0 0 4px;color:#1a428a;font-family:Montserrat,sans-serif;font-size:24px;font-weight:700}
          .pgp-lead{margin:0 0 16px;color:#6c757d;font-size:13px}
          .pgp-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;font-size:13px;color:#1a428a}
          .pgp-chip{cursor:pointer;border-radius:12px;border:1px solid #1a428a;background:#fff;padding:6px 12px;font-family:Roboto,sans-serif;font-size:13px;font-weight:500;color:#1a428a;user-select:none}
          .pgp-chip--on{background:#1a428a;color:#fff}
          .pgp-panel{margin-top:16px;background:#fff;border:1px solid #d1e3f8;border-radius:12px;padding:16px}
          .pgp-panel-title{margin:0 0 8px;color:#1a428a;font-weight:700;font-size:14px}
          .pgp-code{background:#f5f5f5;border-radius:8px;padding:12px;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;color:#212529;min-height:48px}
          .pfm-add{display:inline-flex;align-items:center;margin:0 0 12px}
          .pfm-overlay{position:fixed;inset:0;z-index:4000;background:rgba(15,30,60,0.45);display:flex;align-items:center;justify-content:center;padding:24px;color-scheme:light}
          .pfm-card{background:#fff;border-radius:14px;width:min(1040px,100%);max-width:100%;padding:18px 22px 16px;box-sizing:border-box;max-height:96vh;overflow:hidden;display:flex;flex-direction:column;gap:0;position:relative}
          .pfm-card--sheet{min-height:min(520px,90vh)}
          .pfm-card--solo{width:min(560px,100%);padding:0;max-height:none;overflow:hidden}
          .pfm-card--solo > .pfm-head,.pfm-card--solo > .pfm-actions,.pfm-card--solo .pfm-form{display:none !important}
          .pfm-card--solo .pfm-main{overflow:visible;display:block}
          .pfm-main{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:stretch}
          .pfm-card--sheet .pfm-main{flex-direction:row;gap:12px}
          .pfm-form{flex:1 1 auto;min-width:0;min-height:0;overflow:auto}
          .pfm-card--sheet .pfm-form{flex:1 1 0}
          .pfm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:12px;flex:0 0 auto;position:relative;z-index:3;background:#fff}
          .pfm-head-right{display:flex;align-items:center;gap:8px}
          .pfm-title{font-size:16px;font-weight:500;color:#0F2B5B;margin:0}
          .pfm-close{cursor:pointer;font-size:22px;line-height:1;color:#9aa1b3;padding:0 4px;user-select:none}
          .pfm-cmt-btn{display:inline-flex;align-items:center;gap:8px;border:0;background:#0F2B5B;color:#fff;border-radius:8px;height:36px;padding:0 14px;font:500 13px Roboto,sans-serif;cursor:pointer;user-select:none}
          .pfm-cmt-btn:hover{background:#1A428A}
          .pfm-cmt-btn b{min-width:18px;height:18px;border-radius:999px;background:#fff;color:#0F2B5B;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
          .pfm-cmt-btn.is-on{box-shadow:inset 0 0 0 2px #fff}
          .pfm-sub{font-size:12px;color:#5b6680;margin:0 0 12px}
          .pfm-label{font-size:12px;color:#5b6680;margin:0 0 6px}
          .pfm-input{height:34px;width:100%;border-radius:8px;border:0.5px solid #DDE3F0;background:#fff;font-size:13px;padding:0 10px;color:#1a2540;margin-bottom:10px;box-sizing:border-box;font-family:Roboto,sans-serif}
          .pfm-dates{display:flex;gap:12px;margin-bottom:0}
          .pfm-dates > div{flex:1}
          .pfm-days{display:flex;gap:6px;margin-bottom:10px}
          .pfm-day{width:36px;height:30px;border-radius:7px;background:#EEF1F8;color:#9aa1b3;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
          .pfm-day--on{background:#E6EFFD;color:#1456C7}
          .pfm-periods{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
          .pfm-period{min-width:88px;height:34px;border-radius:8px;background:#EEF1F8;color:#5b6680;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;padding:0 12px;box-sizing:border-box}
          .pfm-period--on{background:#E6EFFD;color:#1456C7;box-shadow:inset 0 0 0 1px #1456C7}
          .pfm-warn{background:#FCEFE1;border-radius:8px;padding:10px 12px;font-size:12px;color:#8A5A1E;margin:0 0 14px;line-height:1.4}
          .pfm-prev{display:block;flex:1 1 auto;margin:4px 0 12px;min-height:260px;border:1px solid #d9e0ef;border-radius:10px;overflow:hidden;background:#fff}
          .pfm-prev .pg2-root,.pfm-prev planninggridv2{display:block;width:100%;height:100%}
          .pfm-bar-fill{height:5px;background:#1456C7;border-radius:3px;margin-bottom:4px}
          .pfm-bar-fill--warn{background:#C97A1E}
          .pfm-prev-cap{margin:0;font-size:10px;color:#5b6680}
          .pfm-actions{display:flex;justify-content:flex-end;gap:10px;flex:0 0 auto;margin-top:auto;padding-top:8px;position:relative;z-index:3;background:#fff}
          .pfm-btn{height:36px;border-radius:8px;padding:0 16px;font-size:13px;display:flex;align-items:center;cursor:pointer;user-select:none;font-family:Roboto,sans-serif}
          .pfm-btn--ghost{border:0.5px solid #DDE3F0;background:#fff;color:#5b6680}
          .pfm-btn--ok{border:none;background:#0F2B5B;color:#fff;font-weight:500;padding:0 18px}
          .pfm-btn-aff{height:32px;border-radius:8px;padding:0 12px;font:500 12px Roboto,sans-serif;border:0.5px solid #0F2B5B;background:#fff;color:#0F2B5B;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center}
          .pfm-btn-aff:hover{background:#0F2B5B;color:#fff}
