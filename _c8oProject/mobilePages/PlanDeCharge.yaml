        	pfRichHtml(text) {
        		const raw = String(text || "");
        		const names = this.pfMentionNames();
        		const paint = (s) => {
        			let out = s;
        			names.forEach((name) => {
        				const esc = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        				out = out.replace(new RegExp("@" + esc + "(?![A-Za-zÀ-ÿ0-9_-])", "g"), ''<span class="pfm-mention">@'' + name + "</span>");
        			});
        			out = out.replace(/@([A-Za-zÀ-ÿ0-9_-]+)/g, (full, name, offset, str) => {
        				const before = str.slice(0, offset);
        				const open = (before.match(/<span class="pfm-mention"/g) || []).length;
        				const close = (before.match(/<\/span>/g) || []).length;
        				if (open > close) return full;
        				return ''<span class="pfm-mention">@'' + name + ''</span>'';
        			});
        			return out;
        		};
        		if (raw.indexOf("<") >= 0 && raw.indexOf(">") > raw.indexOf("<")) return paint(raw);
