          .pfm-seg-btn.is-on{background:#0F2B5B;color:#fff}
          .pfm-who{font-size:11px;color:#5b6680;margin:8px 16px 0}
          .pfm-feed{flex:1;min-height:0;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
          .pfm-msg{background:#F7F9FC;border:1px solid #DDE3F0;border-radius:10px;padding:8px 10px}
