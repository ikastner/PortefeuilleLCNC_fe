        			seen[key] = true;
        			const pl = this.pfFr(e.start) + " · " + this.pfPeriodLbl(this.pfItemPeriod(e));
        			(amap[key] || []).forEach((m) => {
        				out.push(Object.assign({}, m, { fromPastille: true, pastilleLbl: pl }));
        			});
        		});
        		return out;
        	}
        	pfToggleSheet() {
