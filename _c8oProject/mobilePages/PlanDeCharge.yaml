          .tdb .card { background: var(--c-white); border: 1px solid var(--c-border-card); border-radius: var(--r-lg); box-shadow: var(--sh-card); }
          .tdb .search { position: relative; width: 220px; }
          .tdb .input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--control-border); border-radius: 12px; background: #fff; font: 14px var(--font-body); color: var(--c-text); }
          .tdb .segmented { display: inline-flex; gap: 4px; padding: 3px; border: 1px solid #D5DDEA; border-radius: 999px; background: #F4F7FB; }
          .tdb .segmented button { height: 32px; padding: 0 14px; border: 1px solid transparent; border-radius: 999px; background: transparent; color: #3D4D6A; font-size: 13px; font-weight: 500; }
          .tdb .segmented button.is-on { background: #E6EFFD; border-color: #C5D4EE; color: #0F2B5B; font-weight: 600; }
          .tdb .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; border: 0; font-size: 12px; font-weight: 500; }
          .tdb .chip--primary { background: var(--c-primary-2); color: var(--c-primary-deep); }
          .tdb .chip--violet { background: #F6E8F0; color: var(--c-violet); }
          .tdb .avatar { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 700; }
          .tdb .dash-week__chevron { display: inline-flex; }
          .tdb .dash-week__chevron--prev { transform: rotate(180deg); }
          .tdb .dash-cap__bar { height: 104px; min-height: 104px; }
          .tdb .dash-cap__bar span { display: block; width: 100%; border-radius: 2px; }
          .tdb .tdb-skel { display: flex; flex-direction: column; }
          .tdb .tdb-skel__sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
          .tdb .tdb-skel__bone { display: block; border-radius: 8px; background: linear-gradient(90deg, #E6E9EC 0%, #F8F9FA 45%, #E6E9EC 100%); background-size: 220% 100%; animation: tdb-shimmer 1.3s ease-in-out infinite; }
          .tdb .tdb-skel__pill { width: 220px; height: 40px; border-radius: 999px; margin-bottom: 16px; }
          .tdb .tdb-skel__title { width: min(420px, 80%); height: 28px; margin-bottom: 16px; }
          .tdb .tdb-skel__line { width: 100%; height: 14px; margin: 8px 0; }
          .tdb .tdb-skel__line--mid { width: 72%; }
          .tdb .tdb-skel__line--short { width: 42%; }
          .tdb .tdb-skel__caps { display: flex; align-items: flex-end; gap: 10px; margin-top: 12px; }
          .tdb .tdb-skel__cap { width: 34px; height: 104px; border-radius: 8px; }
          .tdb .tdb-skel__kpi { min-height: 96px; }
          .tdb .tdb-skel__value { width: 38%; height: 28px; margin-top: 10px; }
          .tdb .tdb-skel__toolbar { display: flex; align-items: center; gap: 12px; padding: 16px 18px; }
          .tdb .tdb-skel__chip { width: 180px; height: 36px; border-radius: 999px; }
          .tdb .tdb-skel__search { width: 220px; height: 40px; margin-left: auto; }
          .tdb .tdb-skel__row { display: flex; align-items: center; gap: 12px; padding: 10px 18px; }
          .tdb .tdb-skel__avatar { width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto; }
          .tdb .tdb-skel__row .tdb-skel__line { margin: 0; }
          .tdb .tdb-skel__side { display: flex; flex-direction: column; gap: 8px; min-height: 140px; }
          .tdb .tdb-skel__hero { pointer-events: none; }
          @keyframes tdb-shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
          @media (prefers-reduced-motion: reduce) { .tdb .tdb-skel__bone { animation: none; background: #E6E9EC; } }
          .tdb .tdb-wait { padding: 24px; color: #6C757D; }
          .tdb .tdb-detail { position: fixed; inset: 0; z-index: 80; background: rgba(18, 47, 98, 0.35); display: flex; align-items: center; justify-content: center; padding: 24px; }
          .tdb-detail__card { width: min(360px, 100%); background: #fff; border-radius: 16px; padding: 16px 18px; box-shadow: 0 8px 24px rgba(15, 43, 91, 0.16); }
          .tdb-detail__card strong { display: block; color: #122F62; font-family: Montserrat, sans-serif; }
          .tdb-detail__card p { margin: 6px 0; color: #495057; font-size: 14px; }
          .tdb-detail__actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
          .tdb .btn { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid #1A428A; background: transparent; color: #1A428A; font: 500 13px Roboto, sans-serif; }
          .tdb .btn--primary { background: #1A428A; color: #fff; }
          .tdb .head-today { background: var(--c-primary-1); }
          .tdb .head-focus { background: var(--c-primary-2); }
          .tdb .bg-today { background: rgba(239, 244, 255, 0.7); }
          .tdb .bg-focus { background: var(--c-primary-2); }
          .tdb .kpi-good { background: var(--c-success-1); color: var(--c-success); }
          .tdb .kpi-bad { background: var(--c-warning-1); color: var(--c-warning-text); }
          .tdb .kpi-flat { background: var(--c-grey-1); color: var(--c-muted); }
          
          /* ---------- Tableau de bord : la semaine de l''équipe ---------- */
          
          .tdb .dash-hero{
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(260px, 440px);
            gap: var(--s-6);
            padding: 24px 28px;
            margin-bottom: var(--s-4);
            overflow: hidden;
            border: 1px solid var(--c-border-card);
            border-radius: var(--r-lg);
            background: 
              radial-gradient(600px 240px at 100% 0%, rgba(219, 231, 255, 0.9), transparent 70%),
              radial-gradient(400px 200px at 0% 100%, rgba(224, 253, 255, 0.7), transparent 70%),
              var(--c-white);
            box-shadow: var(--sh-blue);
          }
          
          .tdb .dash-week{
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px;
            border: 1px solid var(--c-border-soft);
            border-radius: var(--r-pill);
            background: var(--c-white);
          }
          
          .tdb .dash-week__btn{
            display: inline-grid;
            place-items: center;
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--c-primary);
            cursor: pointer;
            transition: background var(--t-fast);
          }
          
          .tdb .dash-week__btn:hover{ background: var(--c-primary-1); }
          .tdb .dash-week__btn:focus-visible{ outline: none; box-shadow: var(--focus-ring); }
          
          .tdb .dash-week__label{
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 32px;
            padding: 0 8px 0 6px;
            border: 0;
            border-radius: var(--r-pill);
            background: transparent;
            font: 500 14px var(--font-body);
            color: var(--c-text-2);
            cursor: pointer;
            transition: background var(--t-fast);
          }
          
          .tdb .dash-week__label:hover,
          .tdb .dash-week__label.is-open{ background: var(--c-primary-1); }
          .tdb .dash-week__label:focus-visible{ outline: none; box-shadow: var(--focus-ring); }
          .tdb .dash-week__caret{ display: inline-flex; color: var(--c-muted); }
          
          .tdb .dash-week__num{
            padding: 2px 8px;
            border-radius: var(--r-pill);
            background: var(--c-primary);
            color: var(--c-white);
            font-family: var(--font-title);
            font-size: 12px;
            font-weight: 700;
          }
          
          .tdb .dash-week__today{
            height: 32px;
            padding: 0 12px;
            margin-left: 4px;
            border: 0;
            border-radius: var(--r-pill);
            background: var(--c-primary-1);
            color: var(--c-primary);
            font: 600 13px var(--font-body);
            cursor: pointer;
          }
          
          .tdb .dash-week__today:hover{ background: var(--c-primary-2); }
          
          /* Sélecteur de semaine */
          .tdb .dash-wp-backdrop{ position: fixed; inset: 0; z-index: 140; background: transparent; }
          .tdb .dash-wp{
            position: fixed;
            z-index: 150;
            width: 300px;
            padding: 0;
            border: 1px solid var(--c-border-soft);
            border-radius: var(--r-md);
            background: var(--c-white);
            box-shadow: 0 12px 32px rgba(15, 43, 91, 0.16);
            animation: dash-fade-up 0.15s ease-out;
          }
          .tdb .dash-wp__head{ display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-bottom: 4px; }
          .tdb .dash-wp__month{ flex: 1; text-align: center; font-size: 13px; font-weight: 700; color: var(--c-primary-deep); }
          .tdb .dash-wp__list{ display: flex; flex-direction: column; gap: 2px; max-height: 260px; overflow: auto; }
          .tdb .dash-wp__item{
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 10px;
            border: 0;
            border-radius: var(--r-sm);
            background: transparent;
            text-align: left;
            font: 500 13px var(--font-body);
            color: var(--c-text);
            cursor: pointer;
            transition: background var(--t-fast);
          }
          .tdb .dash-wp__item:hover,
          .tdb .dash-wp__item:focus-visible{ background: var(--c-primary-1); outline: none; }
          .tdb .dash-wp__item.is-current{ background: var(--c-primary-1); font-weight: 600; }
          .tdb .dash-wp__item.is-today:not(.is-current) .dash-week__num{ background: var(--c-primary-2); color: var(--c-primary); }
          .tdb .dash-wp__range{ flex: 1; min-width: 0; color: var(--c-text-2); }
          .tdb .dash-wp__item.is-current .dash-wp__range{ color: var(--c-text); }
          .tdb .dash-wp__badge{ flex-shrink: 0; padding: 1px 7px; border-radius: var(--r-pill); background: var(--c-primary); color: var(--c-white); font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
          .tdb .dash-wp__check{ display: inline-flex; flex-shrink: 0; margin-left: auto; color: var(--c-primary); }
          
          .tdb .dash-hero__title{
            margin: 16px 0 12px;
            font-family: var(--font-title);
            font-size: var(--fs-h2);
            font-weight: 700;
            line-height: 1.2;
            color: var(--c-primary-deep);
          }
          
          .tdb .dash-insights{
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: 720px;
            padding: 0;
            margin: 0;
            list-style: none;
          }
          
          .tdb .dash-insights li{ animation: dash-fade-up 0.4s ease-out backwards; }
          
          .tdb .dash-insights li:not(.has-action),
          .tdb .dash-insights__action{
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 7px 10px;
            margin-left: -10px;
            border-radius: 10px;
            font: 15px/1.45 var(--font-body);
            color: var(--c-text-2);
          }
          
          .tdb .dash-insights__action{
            width: calc(100% + 10px);
            border: 0;
            background: transparent;
            text-align: left;
            cursor: pointer;
            transition: background var(--t-fast);
          }
          
          .tdb .dash-insights__action:hover{ background: rgba(239, 244, 255, 0.9); }
          .tdb .dash-insights__action:focus-visible{ outline: none; box-shadow: var(--focus-ring); }
          .tdb .dash-insights strong{ color: var(--c-text); font-weight: 600; }
          
          .tdb .dash-insights__icon{
            display: inline-grid;
            flex: 0 0 auto;
            place-items: center;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: var(--c-primary-1);
            color: var(--c-primary);
          }
                    .tdb .dash-insights__icon svg{ display: block; width: 16px; height: 16px; }
          
          
          .tdb .dash-hero__right{
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px 18px 12px;
            border: 1px solid var(--c-border-soft);
            border-radius: var(--r-md);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
          }
          
          .tdb .dash-cap__head{
            display: flex;
            flex-direction: column;
            font-family: var(--font-title);
            font-size: 14px;
            font-weight: 700;
            color: var(--c-primary-deep);
          }
          
          .tdb .dash-cap__head span{
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 400;
            color: var(--c-muted);
          }
          
          .tdb .dash-cap{
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 6px;
            width: 100%;
          }
          .tdb .dash-cap:not(.dash-cap--scroll) .dash-cap__day{ flex: 1 1 0; min-width: 0; }
          
          .tdb .dash-cap__day{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 8px 8px 6px;
            border: 1px solid transparent;
            border-radius: 12px;
            background: transparent;
            font-family: var(--font-body);
            cursor: pointer;
            transition: background var(--t-fast), border-color var(--t-fast);
          }
          
          .tdb .dash-cap__day:hover{ background: var(--c-grey-1); }
          .tdb .dash-cap__day:focus-visible{ outline: none; box-shadow: var(--focus-ring); }
          .tdb .dash-cap__day.is-focus{ border-color: var(--c-primary-3); background: var(--c-primary-1); }
          
          .tdb .dash-cap__pct{
            font-size: 12px;
            font-weight: 700;
            color: var(--c-text);
            font-variant-numeric: tabular-nums;
          }
          
          .tdb .dash-cap__bar{
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 2px;
            width: 34px;
            height: 104px;
            overflow: hidden;
            border-radius: 8px;
            background: var(--c-grey-1);
            transform-origin: bottom;
            animation: dash-grow 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
          }
          
          .tdb .dash-cap__bar span{ display: block; flex: 0 0 auto; }
          
          .tdb .dash-hero .is-projet{ background: var(--c-primary); }
          .tdb .dash-hero .is-libre{ background: repeating-linear-gradient(135deg, #9ED9DD 0 3px, var(--c-secondary-1) 3px 6px); }
          .tdb .dash-hero .is-absence{ background: var(--c-violet-soft); }
          .tdb .dash-hero .is-formation{ background: #7FB6DE; }
          .tdb .dash-hero .is-ferie{ background: repeating-linear-gradient(135deg, var(--c-grey-2) 0 4px, var(--c-grey-1) 4px 8px); }
          
          .tdb .dash-cap__label{
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--c-text-2);
            line-height: 1.2;
          }
          
          .tdb .dash-cap__label small{ font-size: 11px; font-weight: 400; color: var(--c-muted); }
          .tdb .dash-cap__day.is-today .dash-cap__label{ color: var(--c-primary); }
          .tdb .dash-cap__day.is-today .dash-cap__label small{ color: var(--c-primary); font-weight: 600; }
          .tdb .dash-cap__day.is-today .dash-cap__bar{ box-shadow: 0 0 0 2px var(--c-primary-3); }
          
          .tdb .dash-cap__legend{
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            font-size: 12px;
            color: var(--c-muted);
          }
          
          .tdb .dash-cap__legend span{ display: inline-flex; align-items: center; gap: 6px; }
          .tdb .dash-cap__legend i{ width: 10px; height: 10px; border-radius: 3px; }
          
          /* Indicateurs avec tendance */
          .tdb .dash-kpis{
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: var(--s-4);
            margin-bottom: var(--s-4);
          }
          
          .tdb .dash-kpi{
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 16px 20px;
            animation: dash-fade-up 0.4s ease-out backwards;
          }
          
          .tdb .dash-kpi:nth-child(2){ animation-delay: 60ms; }
          .tdb .dash-kpi:nth-child(3){ animation-delay: 120ms; }
          .tdb .dash-kpi:nth-child(4){ animation-delay: 180ms; }
          
          .tdb .dash-kpi__label{
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--c-muted);
          }
          
          .tdb .dash-kpi__label svg{ color: var(--c-primary-5); }
          
          .tdb .dash-kpi__value{
            font-family: var(--font-title);
            font-size: 28px;
            font-weight: 700;
            color: var(--c-primary-deep);
            font-variant-numeric: tabular-nums;
          }
          
          .tdb .dash-kpi__delta{
            align-self: flex-start;
            padding: 2px 8px;
            border-radius: var(--r-pill);
            font-size: 12px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
          }
          
          .tdb .dash-kpi__delta span{ font-weight: 400; opacity: 0.8; }
          .tdb .dash-kpi__delta--good{ background: var(--c-success-1); color: var(--c-success); }
          .tdb .dash-kpi__delta--bad{ background: var(--c-warning-1); color: var(--c-warning-text); }
          .tdb .dash-kpi__delta--flat{ background: var(--c-grey-1); color: var(--c-muted); }
          
          /* Mise en page principale */
          .tdb .dash-layout{
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(248px, 272px);
            gap: 12px;
            align-items: start;
          }
          .tdb.tdb--week .dash-layout{
            grid-template-columns: minmax(0, 1fr) minmax(232px, 256px);
            gap: 10px;
          }
          
          .tdb .dash-main{ padding: 0; overflow: hidden; }
          
          .tdb .dash-toolbar{
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--c-grey-2);
          }
          
          .tdb .dash-toolbar h3{
            margin: 0 8px 0 0;
            font-family: var(--font-title);
            font-size: 18px;
            font-weight: 700;
            color: var(--c-primary-deep);
          }
          
          .tdb .dash-toolbar .search{ width: 220px; }
          .tdb .dash-focusbar{ display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
          .tdb .dash-focusbar:empty{ display: none; }
          .tdb .dash-focusbar .chip{ display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
          .tdb .dash-focusbar .chip::after{ content: "\00d7"; font-size: 14px; font-weight: 500; line-height: 1; opacity: .7; }
          
          .tdb .dash-grid-wrap{
            max-height: calc(100vh - 180px);
            min-height: 320px;
            overflow: auto;
          }
          
          /* Frise semaine : 1 colonne nom + 10 demi-journées + taux */
          .tdb .dash-grid{ --dash-cols: 5; --dash-col-w: minmax(0, 1fr); min-width: 0; padding-bottom: 8px; }
          
          .tdb .dash-row{
            display: grid;
            grid-template-columns: var(--dash-name-w, 200px) repeat(var(--dash-cols), var(--dash-col-w)) var(--dash-rate-w, 104px);
            grid-template-rows: 46px;
            border-bottom: 1px solid var(--c-grey-1);
            transition: background var(--t-fast);
          }
          
          .tdb .dash-row > *{ grid-row: 1; min-width: 0; }
          .tdb .dash-row:not(.dash-row--head):hover{ background: rgba(239, 244, 255, 0.45); }
          .tdb .dash-row.is-flash{ animation: dash-flash 1.6s ease-out; }
          
          .tdb .dash-row--head{
            position: sticky;
            top: 0;
            z-index: 3;
            grid-template-rows: 52px;
            border-bottom: 1px solid var(--c-grey-2);
            background: var(--c-white);
          }
          
          .tdb .dash-cell-name{
            grid-column: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px 0 20px;
          }
          
          .tdb .dash-row--head .dash-cell-name,
          .tdb .dash-row--head .dash-cell-rate{
            font-size: 12px;
            color: var(--c-muted);
          }
          
          .tdb .dash-cell-name__txt{
            display: flex;
            flex-direction: column;
            min-width: 0;
            font-size: 14px;
            font-weight: 500;
            color: var(--c-text);
            line-height: 1.2;
          }
          
          .tdb .dash-cell-name__txt small{
            overflow: hidden;
            font-size: 11.5px;
            font-weight: 400;
            color: var(--c-muted);
            white-space: nowrap;
            text-overflow: ellipsis;
          }
          
          .tdb .dash-cell-rate{
            grid-column: calc(2 + var(--dash-cols));
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px 0 12px;
            font-size: 12px;
            color: var(--c-muted);
            font-variant-numeric: tabular-nums;
          }
          
          .tdb .dash-rate{
            flex: 1 1 auto;
            height: 6px;
            overflow: hidden;
            border-radius: var(--r-pill);
            background: var(--c-grey-2);
          }
          
          .tdb .dash-rate span{ display: block; height: 100%; border-radius: inherit; background: var(--c-primary-5); }
          .tdb .dash-rate span.is-high{ background: var(--c-success); }
          .tdb .dash-rate span.is-low{ background: var(--c-warning); }
          
          .tdb .dash-dayhead{
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10px;
            border-left: 1px solid var(--c-grey-2);
            transition: background var(--t-fast);
          }
          
          .tdb .dash-dayhead strong{ font-family: var(--font-title); font-size: 13px; color: var(--c-text); }
          .tdb .dash-dayhead span{ font-size: 11px; color: var(--c-muted); }
          .tdb .dash-dayhead.is-today{ background: var(--c-primary-1); }
