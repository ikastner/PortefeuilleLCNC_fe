        	pfIsoAdd(iso, n) {
        		const d = new Date(String(iso) + "T12:00:00");
        		d.setDate(d.getDate() + n);
        		const m = String(d.getMonth() + 1).padStart(2, "0");
        		const day = String(d.getDate()).padStart(2, "0");
        		return d.getFullYear() + "-" + m + "-" + day;
        	}
        	pfDow(iso) {
        		const js = new Date(String(iso) + "T12:00:00").getDay();
        		return js === 0 ? 6 : js - 1;
        	}
        	pfIsHoliday(iso) {
        		return !!(this.pfHolidays && this.pfHolidays[iso]);
        	}
        	pfIsBlockedDay(iso) {
        		const i = this.pfDow(iso);
        		if (i < 0 || i > 4) return true;
        		return this.pfIsHoliday(iso);
        	}
        	pfSnapWorking(iso, dir) {
        		let d = String(iso || "");
        		let g = 0;
        		while (d && this.pfIsBlockedDay(d) && g++ < 400) d = this.pfIsoAdd(d, dir);
        		return d;
        	}
        	pfFr(iso) {
        		const p = String(iso || "").split("-");
        		if (p.length !== 3) return String(iso || "");
        		return p[2] + "/" + p[1] + "/" + p[0];
        	}
        	pfRowById(id) {
        		const rows = this.pfRows || [];
        		for (let i = 0; i < rows.length; i++) if (rows[i].id === id) return rows[i];
        		return null;
        	}
        	pfPersonName() {
        		const r = this.pfRowById(this.pfFormRowId);
        		return r ? r.name : "";
        	}
        	pfStampTypeOnPastilles(items) {
        		return (items || []).map((e) => {
        			const t = e.type || this.pfTypeOf(e.label);
        			const chip = this.pfTypeChip(t, e.label);
        			const cls = t === "nc" ? "st-ok" : (t === "abs" ? "st-pending" : "st-wait");
        			return Object.assign({}, e, { type: t, status: chip, statusShort: chip, statusClass: cls });
        		});
        	}
        	pfDaysFromRange(a, b) {
        		const on = [false, false, false, false, false];
        		let d = a;
        		let guard = 0;
        		while (d && b && d <= b && guard < 400) {
        			const i = this.pfDow(d);
        			if (i >= 0 && i <= 4 && !this.pfIsHoliday(d)) on[i] = true;
        			d = this.pfIsoAdd(d, 1);
        			guard++;
        		}
        		if (!on[0] && !on[1] && !on[2] && !on[3] && !on[4]) return [true, true, true, true, true];
        		return on;
        	}
        	pfCovers(iso) {
        		const i = this.pfDow(iso);
        		if (i < 0 || i > 4) return false;
        		if (this.pfIsHoliday(iso)) return false;
        		if (!(this.pfDayOn && this.pfDayOn[i])) return false;
        		return iso >= this.pfFormStart && iso <= this.pfFormEnd;
        	}
        	pfOverlaps(it) {
        		if (!it || it.rowId !== this.pfFormRowId) return false;
        		if (this.pfFormId && it.id === this.pfFormId) return false;
        		return !(it.end < this.pfFormStart || it.start > this.pfFormEnd);
        	}
        	pfConflictItems() {
        		const drafts = this.pfModalDraftItems();
        		const keepId = String(this.pfFormId || "");
        		return (this.pfItems || []).filter((e) => {
        			if (keepId && String(e.id) === keepId) return false;
        			return drafts.some((d) => this.pfWouldReplace(e, d));
        		});
        	}
        	pfHasConflict() {
        		return this.pfConflictItems().length > 0;
        	}
        	pfConflictText() {
        		const list = this.pfConflictItems();
        		if (!list.length) return "";
        		const e = list[0];
        		const who = this.pfPersonName() || "Cette personne";
        		const span = e.start === e.end ? this.pfFr(e.start) : this.pfFr(e.start) + " → " + this.pfFr(e.end);
        		return "Sur " + span + ", " + who + " est deja affectee a " + (e.label || "une activite") + ". Cette affectation remplacera le creneau concerne.";
        	}
        	pfSelectedDays() {
        		const out = [];
        		let d = String(this.pfFormStart || "");
        		const b = String(this.pfFormEnd || "");
        		let guard = 0;
        		while (d && b && d <= b && guard < 400) {
        			if (this.pfCovers(d)) out.push(d);
        			d = this.pfIsoAdd(d, 1);
        			guard++;
        		}
        		return out;
        	}
        	pfExplodeDayItems(list) {
        		const out = [];
        		(list || []).forEach((e) => {
        			const a = String(e.start || "");
        			const b = String(e.end || a);
        			if (!a || a === b) {
        				out.push(e);
        				return;
        			}
        			let d = a;
        			let guard = 0;
        			let first = true;
        			const extra = (String(e.extra || "").indexOf("→") >= 0 || String(e.extra || "").indexOf("->") >= 0) ? "Journée" : e.extra;
        			while (d && d <= b && guard < 400) {
        				const copy = Object.assign({}, e, {
        					id: first ? String(e.id) : (String(e.id) + "_" + d),
        					start: d,
        					end: d,
        					extra: extra
        				});
        				out.push(copy);
        				first = false;
        				d = this.pfIsoAdd(d, 1);
        				guard++;
        			}
        		});
        		return out;
        	}
        	pfModalDraftItems() {
        		const rowId = String(this.pfFormRowId || "");
        		if (!rowId) return [];
        		const days = this.pfSelectedDays();
        		const keepId = String(this.pfFormId || "");
        		return days.map((day, i) => this.pfDayItem(day, (i === 0 && keepId) ? keepId : ("__draft__" + day)));
        	}
        	pfRefreshModal() {
        		this.pfBuildActivityOpts();
        		this.pfChargeDays = [];
        		const id = String(this.pfFormRowId || "");
        		this.pfModalRows = (this.pfRows || []).filter((r) => r.id === id);
