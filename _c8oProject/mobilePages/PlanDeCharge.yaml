        	pfFlattenFeed(list) {
        		const src = list || [];
        		const byId: any = {};
        		src.forEach((m) => { if (m && m.id != null) byId[m.id] = m; });
        		const children: any = {};
        		const roots: any[] = [];
        		src.forEach((m) => {
        			let root = m;
        			let g = 0;
        			while (root && root.replyTo != null && byId[root.replyTo] && g++ < 20) root = byId[root.replyTo];
        			if (!m.replyTo || !byId[m.replyTo] || m.id === root.id) roots.push(m);
        			else {
        				if (!children[root.id]) children[root.id] = [];
        				children[root.id].push(m);
        			}
        		});
        		const out: any[] = [];
        		roots.forEach((m) => {
        			out.push(Object.assign({}, m, { nested: false, html: this.pfRichHtml(m.body) }));
        			(children[m.id] || []).forEach((c) => {
