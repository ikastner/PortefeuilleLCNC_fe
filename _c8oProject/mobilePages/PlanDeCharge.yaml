        		this.pfUpdateMentions();
        	}
        	pfProjectPeople() {
        		const label = String(this.pfFormLabel || "");
        		const byId: any = {};
        		(this.pfRows || []).forEach((r: any) => { if (r && r.id != null) byId[String(r.id)] = String(r.name || ""); });
        		const seen: any = {};
        		const out: string[] = [];
        		(this.pfItems || []).forEach((e: any) => {
        			if (label && String(e.label || "") !== label) return;
        			const name = byId[String(e.rowId)];
        			if (!name || seen[name]) return;
        			seen[name] = true;
        			out.push(name);
        		});
        		out.sort((a, b) => a.localeCompare(b, "fr"));
        		return out;
        	}
        	pfMentionNames() {
        		const seen: any = {};
        		const out: string[] = ["Tout le monde"];
        		seen["Tout le monde"] = true;
        		this.pfProjectPeople().forEach((n) => { if (!seen[n]) { seen[n] = true; out.push(n); } });
        		return out;
        	}
        	pfUpdateMentions() {
        		const t = this.pfPlain(this.pfDraft);
        		const m = t.match(/@([A-Za-zÀ-ÿ0-9_-]*)$/);
        		if (!m) {
        			this.pfMentionOpen = false;
        			this.pfMentionHits = [];
        			return;
        		}
        		const q = String(m[1] || "").toLowerCase();
        		const everyone = "Tout le monde";
        		const hits: string[] = [];
        		if (!q || everyone.toLowerCase().indexOf(q) === 0) hits.push(everyone);
        		this.pfProjectPeople().forEach((n) => {
        			if (!q || String(n).toLowerCase().indexOf(q) === 0) hits.push(n);
        		});
        		this.pfMentionHits = hits;
        		this.pfMentionOpen = hits.length > 0;
        	}
        	pfPickMention(name) {
        		const n = String(name || "");
        		const chip = ''<span class="pfm-mention" style="color:#C0392B;font-weight:600">@'' + n + ''</span>&nbsp;'';
        		this.pfDraft = String(this.pfDraft || "").replace(/@([A-Za-zÀ-ÿ0-9_-]*)(?=\s*(?:<[^>]+>\s*)*$)/, chip);
        		this.pfMentionOpen = false;
        		this.pfMentionHits = [];
        	}
        	pfStartReply(cmt) {
        		if (!cmt) return;
        		this.pfReplyTo = { id: cmt.id, author: cmt.author, snippet: this.pfSnippet(cmt.body) };
        		const at = "@" + String(cmt.author || "") + " ";
        		let d = String(this.pfDraft || "");
        		if (this.pfPlain(d).indexOf(at.trim()) < 0) {
        			if (d.indexOf("<p") === 0) d = d.replace(/<p([^>]*)>/, "<p$1>" + at);
        			else d = at + d;
        			this.pfDraft = d;
        		}
        		this.pfUpdateMentions();
        	}
        	pfCancelReply() {
        		this.pfReplyTo = null;
        	}
        	pfAddDayComment() {
        		this.pfCmtThread = "day";
        		this.pfDraft = this.pfDayDraft;
        		this.pfSendComment();
        		this.pfDayDraft = "";
        	}
        	pfAddProjectComment() {
        		this.pfCmtThread = "proj";
        		this.pfDraft = this.pfProjDraft;
        		this.pfSendComment();
        		this.pfProjDraft = "";
        	}
        
        	get pfRows(): any[] { return this.rows || []; }
        	get pfItems(): any[] { return this.items || []; }
        	get pfHolidays(): any { return this.holidays || {}; }
        	get pfLabels(): any { return this.gridLabels || {}; }
        	get pfTypeStyles(): any { return this.typeStyles || {}; }
        	get pfTypeLabels(): any { return this.typeLabels || {}; }
        	get pfMeRowId(): string { return String(this.cleActeur || ""); }
        	get pfCellOrder(): any { return {}; }
        	pfIsTrue(v) {
        		const s = String(v == null ? "" : v).toLowerCase();
        		return s === "true" || s === "t" || s === "1";
        	}
        	pfElementOf(label) {
        		const lab = String(label || "");
        		const list = this.elements || [];
        		for (let i = 0; i < list.length; i++) if (String(list[i].libelle || "") === lab) return list[i];
        		return null;
        	}
        	pfTypeOf(label) {
        		const lab = String(label || "");
        		const list = this.types || [];
        		for (let i = 0; i < list.length; i++) {
        			const t = list[i];
        			if (this.pfIsTrue(t.requiertElement)) continue;
        			if (String(t.libelle || "") === lab || String(t.code || "") === lab) return String(t.code);
        		}
        		return "PROJET";
        	}
        	pfTypeCaption(type) {
        		const m = this.typeLabels || {};
        		return m[type] || String(type || "Activité");
        	}
        	pfTypeChip(type, label) {
        		const t = String(type || this.pfTypeOf(label));
        		if (t === "ABSENCE") return "Absence";
        		if (t !== "PROJET") return this.pfTypeCaption(t);
        		const el = this.pfElementOf(label);
        		if (el && String(el.code) === "ABSENCEPREV") return "AbsencePrev";
        		if (el && String(el.code) === "FORMATION") return "Formation";
        		return el ? String(el.lcNc || "") : "";
        	}
        	pfStyleKey(label) {
        		const el = this.pfElementOf(label);
        		return el && String(el.code) === "FORMATION" ? "FORMATION" : "";
        	}
        	pfStatusClass(type, label) {
        		const chip = this.pfTypeChip(type, label);
        		if (type === "ABSENCE" || chip === "AbsencePrev" || chip === "Formation") return "st-pending";
        		if (chip === "NC") return "st-ok";
        		return "st-wait";
        	}
        	pfBuildActivityOpts() {
        		const seen = {};
        		const out = [];
        		const push = (lab, caption, type, rank) => {
        			if (!lab || seen[lab]) return;
        			seen[lab] = true;
        			out.push({ value: lab, caption: caption, type: type, rank: rank });
        		};
        		(this.types || []).forEach((t) => {
        			if (this.pfIsTrue(t.requiertElement)) return;
        			const lab = String(t.libelle || t.code || "");
        			if (!this.pfIsTrue(t.actif == null ? "true" : t.actif) && lab !== String(this.pfFormLabel || "")) return;
        			push(lab, lab, String(t.code || ""), 0);
        		});
        		(this.elements || []).forEach((e) => {
        			if (String(e.actif) === "false") return;
        			const lab = String(e.libelle || "");
        			const lc = String(e.lcNc || "").trim();
        			push(lab, (lc ? lc : "Projet") + " — " + lab, "PROJET", 1);
        		});
        		(this.items || []).forEach((e) => {
        			const lab = String(e.label || "");
        			push(lab, (e.status ? e.status + " — " : "") + lab, String(e.type || "PROJET"), 1);
        		});
        		out.sort((a, b) => (a.rank - b.rank) || String(a.caption).localeCompare(String(b.caption), "fr"));
        		this.pfActivityOpts = out;
        	}
        	pfDefaultLabel() {
        		this.pfBuildActivityOpts();
        		const opts = this.pfActivityOpts || [];
        		for (let i = 0; i < opts.length; i++) if (opts[i].type === "PROJET") return opts[i].value;
        		return opts.length ? opts[0].value : "";
        	}
        	pfDayItem(day, id) {
        		const rowId = String(this.pfFormRowId || "");
        		const label = String(this.pfFormLabel || "Nouvelle affectation");
        		const period = this.pfNormPeriod(this.pfFormPeriod);
        		const type = this.pfTypeOf(label);
        		const chip = this.pfTypeChip(type, label);
        		return {
        			id: id,
        			rowId: rowId,
        			start: day,
        			end: day,
        			type: type,
        			label: label,
        			period: period,
        			status: chip,
        			statusShort: chip,
        			statusClass: this.pfStatusClass(type, label),
        			styleKey: this.pfStyleKey(label),
        			extra: this.pfPeriodLbl(period)
        		};
        	}
        	pfPeriodToDb(p) {
        		const n = this.pfNormPeriod(p);
        		if (n === "AM") return "MATIN";
        		if (n === "PM") return "APREM";
        		return "JOURNEE";
        	}
        	pfRuns(days) {
        		const runs = [];
        		(days || []).forEach((d) => {
        			const last = runs[runs.length - 1];
        			if (last && this.pfIsoAdd(last.to, 1) === d) last.to = d;
        			else runs.push({ from: d, to: d });
        		});
        		return runs;
        	}
        	pfFindItem(id) {
        		const key = String(id == null ? "" : id);
        		return (this.items || []).filter((e) => String(e.id) === key)[0] || null;
        	}
        	pfLocalAdd(rowId, days, codeType, label, periode) {
        		const period = this.pfNormPeriod(this.pfFormPeriod);
        		const t = (this.types || []).filter((x) => String(x.code) === codeType)[0];
        		const el = codeType === "PROJET" ? this.pfElementOf(label) : null;
        		const shown = codeType === "PROJET" ? label : String((t && t.libelle) || label);
        		const code = el ? String(el.code || "") : "";
        		const status = codeType === "ABSENCE" ? "Absence" : (code === "ABSENCEPREV" ? "AbsencePrev" : (code === "FORMATION" ? "Formation" : (el ? String(el.lcNc || "") : "")));
        		const stamp = Date.now();
        		let list = (this.items || []).slice();
        		days.forEach((d) => {
        			const incoming = { rowId: rowId, start: d, end: d, period: period };
        			list = list.filter((e) => !this.pfWouldReplace(e, incoming));
        			list.push({
        				id: "local_" + stamp + "_" + rowId + "_" + d + "_" + periode,
        				rowId: rowId,
        				start: d,
        				end: d,
        				type: codeType,
        				label: shown,
        				codeElement: code,
        				period: periode,
        				status: status,
        				ordre: "0",
        				commentaire: "",
        				commentCount: "0",
        				styleKey: code === "FORMATION" ? "FORMATION" : ""
        			});
        		});
        		this.items = list;
        	}
        	pfLocalRemove(orig) {
        		if (!orig) return;
        		this.items = (this.items || []).filter((e) => e !== orig && String(e.id) !== String(orig.id));
        	}
        	pfFillFromEvent(data) {
        		const found = this.pfFindItem(data && (data.eventId || data.id));
        		if (!found) return false;
        		const day = String((data && data.date) || found.start || "");
        		this.pfModalMode = "view";
        		this.pfFormId = String(found.id);
        		this.pfFormRowId = String(found.rowId);
        		this.pfFormStart = day;
        		this.pfFormEnd = day;
        		this.pfFormLabel = String(found.label || "");
        		this.pfFormPeriod = this.pfNormPeriod((data && data.period) || this.pfItemPeriod(found) || "ALL");
        		this.pfDayOn = this.pfDaysFromRange(day, day);
        		return true;
        	}
        	pfOpenView(data) {
        		if (!this.pfFillFromEvent(data || {})) {
        			if (this.canEdit) this.pfOpenCreate(data || {});
        			return;
        		}
        		this.pfDayDraft = "";
        		this.pfProjDraft = "";
        		this.pfDraft = "";
        		this.pfReplyTo = null;
        		this.pfMentionOpen = false;
        		this.pfSheetOpen = false;
        		this.pfSheetOnly = false;
        		this.pfModalOpen = true;
        		this.pfRefreshModal();
        		this.pfLoadComments();
        	}
        	pfOpenComments(data) {
        		if (!this.pfFillFromEvent(data || {})) return;
        		this.pfDraft = "";
        		this.pfReplyTo = null;
        		this.pfMentionOpen = false;
        		this.pfSheetOnly = true;
        		this.pfModalOpen = false;
        		this.pfSheetOpen = true;
        		this.pfCmtThread = this.pfDefaultThread();
        		this.pfRefreshModal();
        		this.pfLoadComments();
        	}
        	pfFail(err) {
        		this.pfBusy = false;
        		this.message = String((err && err.message) || err);
        		this.refresh();
        	}
        	pfConfirm() {
        		if (this.pfBusy) return;
        		if (!this.canEdit) {
        			this.message = "Droit MODIFIER_AFFECTATION requis.";
        			this.closePfModal();
        			this.refresh();
        			return;
        		}
        		if (!this.pfFormRowId || !this.pfFormStart || !this.pfFormEnd || !this.pfFormLabel) return;
        		const a = this.pfSnapWorking(this.pfFormStart, 1);
        		const b = this.pfSnapWorking(this.pfFormEnd, -1);
        		if (!a || !b || a > b) return;
        		this.pfFormStart = a;
        		this.pfFormEnd = b;
        		const days = this.pfSelectedDays();
        		if (!days.length) return;
        		const label = String(this.pfFormLabel);
        		const codeType = this.pfTypeOf(label);
        		const libelle = codeType === "PROJET" ? label : "";
        		const periode = this.pfPeriodToDb(this.pfFormPeriod);
        		const period = this.pfNormPeriod(this.pfFormPeriod);
        		const rowId = String(this.pfFormRowId);
        		const orig = this.pfFormId ? this.pfFindItem(this.pfFormId) : null;
        		const replaced = !orig || days.some((d) => this.pfWouldReplace(orig, { rowId: rowId, start: d, end: d, period: period }));
        		this.pfBusy = true;
        		this.refresh();
        		let chain: Promise<any> = Promise.resolve(true);
        		this.pfRuns(days).forEach((r) => {
        			chain = chain.then((ok) => {
        				if (!ok) return false;
        				return this.appel("Jour_Enregistrer", {
        					cleActeur: this.cleActeur,
        					cleLigne: rowId,
        					codeType: codeType,
        					libelleElement: libelle,
        					dateFrom: r.from,
        					dateTo: r.to,
        					periode: periode,
        					commentaire: ""
        				}).then((out) => this.okOf(out));
        			});
        		});
        		chain.then((ok) => {
        			if (!ok || replaced) return ok;
        			return this.appel("Jour_Supprimer", {
        				cleActeur: this.cleActeur,
        				cleLigne: String(orig.rowId),
        				jour: String(orig.start),
        				periode: String(orig.period || "JOURNEE")
        			}).then((out) => this.okOf(out));
        		}).then((ok) => {
        			this.pfBusy = false;
        			if (ok) {
        				if (!replaced) this.pfLocalRemove(orig);
        				this.pfLocalAdd(rowId, days, codeType, label, periode);
        				this.message = days.length > 1 ? days.length + " jours affectés." : "Affectation enregistrée.";
        				this.closePfModal();
        				this.refresh();
        			} else {
        				this.chargerGrille(true);
        			}
        		}, (err) => { this.pfFail(err); this.chargerGrille(true); });
        	}
        	pfCanDelete() {
        		return this.canEdit && this.pfModalMode === "view" && !!this.pfFormId;
        	}
        	pfDelete() {
        		if (this.pfBusy || !this.pfCanDelete()) return;
        		const orig = this.pfFindItem(this.pfFormId);
        		if (!orig) return;
        		this.pfBusy = true;
        		this.refresh();
        		this.appel("Jour_Supprimer", {
        			cleActeur: this.cleActeur,
        			cleLigne: String(orig.rowId),
        			jour: String(orig.start),
        			periode: String(orig.period || "JOURNEE")
        		}).then((out) => {
        			this.pfBusy = false;
        			if (this.okOf(out)) {
        				this.pfLocalRemove(orig);
        				this.message = "Affectation supprimée.";
        				this.closePfModal();
        				this.refresh();
        			} else {
        				this.chargerGrille(true);
        			}
        		}, (err) => { this.pfFail(err); this.chargerGrille(true); });
        	}
        	pfSyncCommentCounts() {
        		return;
        	}
        	pfCmtArgs() {
        		const label = String(this.pfFormLabel || "");
        		const codeType = this.pfTypeOf(label);
        		const libelle = codeType === "PROJET" ? label : "";
        		return { libelle: libelle, codeType: libelle ? "" : codeType };
        	}
        	pfStamp(iso) {
        		const s = String(iso || "");
        		if (s.length < 16) return s;
        		return s.substring(8, 10) + "/" + s.substring(5, 7) + " " + s.substring(11, 16);
        	}
        	pfMapMessages(out, fromProject) {
        		return this.asList(this.doc(out).messages).map((m) => ({
        			id: String(m.id),
        			author: String(m.auteur || m.cleAuteur || ""),
        			authorId: String(m.cleAuteur || ""),
        			body: String(m.corps || ""),
        			at: this.pfStamp(m.creeLe),
        			replyTo: m.idParent ? String(m.idParent) : null,
        			fromPastille: !!fromProject && String(m.portee) === "JOUR",
        			pastilleLbl: m.jour ? this.pfFr(String(m.jour)) : ""
        		}));
        	}
        	pfLoadComments() {
        		if (this.pfModalMode !== "view" || !this.pfFormRowId || !this.pfFormStart) {
        			this.pfRefreshComments();
        			return;
        		}
        		const ak = this.pfAssignKey();
        		const pk = this.pfProjectKey();
        		const args = this.pfCmtArgs();
        		this.appel("Commentaire_Lire", {
        			portee: "JOUR",
        			cleLigne: this.pfFormRowId,
        			jour: this.pfFormStart,
        			libelleElement: args.libelle,
        			codeType: args.codeType
        		}).then((out) => {
        			this.pfAssignComments[ak] = this.pfMapMessages(out, false);
        			this.pfRefreshComments();
        			this.refresh();
        		});
        		if (!args.libelle) {
        			this.pfProjectComments[pk] = [];
        			this.pfRefreshComments();
        			return;
        		}
        		this.appel("Commentaire_Lire", {
        			portee: "ELEMENT",
        			cleLigne: "",
        			jour: "",
        			libelleElement: args.libelle,
        			codeType: ""
        		}).then((out) => {
        			this.pfProjectComments[pk] = this.pfMapMessages(out, true);
        			this.pfRefreshComments();
        			this.refresh();
        		});
        	}
        	pfRefreshComments() {
        		const ak = this.pfAssignKey();
        		const pk = this.pfProjectKey();
        		this.pfDayCmtList = ((this.pfAssignComments || {})[ak] || []).slice();
        		this.pfCmtCount = this.pfDayCmtList.length;
        		this.pfProjCmtList = ((this.pfProjectComments || {})[pk] || []).slice();
        		this.pfCanCmtDay = this.pfCanCommentDay();
        		this.pfCanCmtProj = this.pfCanCommentProject();
        		this.pfDayEmptyFlag = this.pfDayEmpty();
        		this.pfProjEmptyFlag = this.pfProjEmpty();
        		this.pfDayTitleTxt = this.pfDayThreadTitle();
        		this.pfProjTitleTxt = this.pfProjectThreadTitle();
        		this.pfDayHintTxt = this.pfDayHint();
        		const feedSrc = this.pfCmtThread === "proj" ? this.pfProjCmtList : this.pfDayCmtList;
        		this.pfFeedList = this.pfFlattenFeed(feedSrc);
        		this.pfFeedEmptyFlag = !(this.pfFeedList && this.pfFeedList.length);
        		this.pfCanComposer = this.pfCmtThread === "proj" ? this.pfCanCmtProj : this.pfCanCmtDay;
        		this.pfShowProjCta = this.pfCmtThread === "day" && this.pfFeedEmptyFlag && !!(this.pfProjCmtList && this.pfProjCmtList.length);
        	}
        	pfIsLecteur() {
        		return false;
        	}
        	pfCanCommentDay() {
        		if (this.pfModalMode !== "view") return false;
        		if (!this.pfFormStart || !this.pfFormLabel) return false;
        		if (String(this.pfFormRowId) === String(this.cleActeur)) return this.has("COMMENTER_JOUR_SOI") || this.has("COMMENTER_JOUR_AUTRUI");
        		return this.has("COMMENTER_JOUR_AUTRUI");
        	}
        	pfCanCommentProject() {
        		return !!this.pfCmtArgs().libelle && this.has("COMMENTER_PROJET");
        	}
        	pfDayHint() {
        		if (this.pfModalMode !== "view") return "Enregistrez l’affectation pour commenter cette journée.";
        		if (!this.pfCanCommentDay()) return "Vous n’avez pas le droit de commenter cette journée. Le fil projet reste ouvert.";
        		return "";
        	}
        	pfMentionArgs(text) {
        		const plain = this.pfPlain(text);
        		const ids = [];
        		(this.rows || []).forEach((r) => {
        			const name = String(r.name || "");
        			if (name && plain.indexOf("@" + name) >= 0 && ids.indexOf(String(r.id)) < 0) ids.push(String(r.id));
        		});
        		return { mentions: ids.join(","), tous: plain.indexOf("@Tout le monde") >= 0 ? "true" : "false" };
        	}
        	pfSendComment() {
        		if (this.pfBusy) return;
        		const proj = this.pfCmtThread === "proj";
        		if (proj ? !this.pfCanCommentProject() : !this.pfCanCommentDay()) return;
        		const text = String(this.pfDraft || "").trim();
        		if (!this.pfPlain(text)) return;
        		const args = this.pfCmtArgs();
        		const men = this.pfMentionArgs(text);
        		const replyId = this.pfReplyTo && this.pfReplyTo.id;
        		this.pfBusy = true;
        		this.appel("Commentaire_Ajouter", {
        			cleActeur: this.cleActeur,
        			portee: proj ? "ELEMENT" : "JOUR",
        			cleLigne: proj ? "" : this.pfFormRowId,
        			jour: proj ? "" : this.pfFormStart,
        			libelleElement: args.libelle,
        			codeType: args.codeType,
        			corps: text,
        			idParent: replyId ? String(replyId) : "",
        			mentions: men.mentions,
        			tous: men.tous
        		}).then((out) => {
        			this.pfBusy = false;
        			if (this.okOf(out)) {
        				this.pfDraft = "";
        				this.pfReplyTo = null;
        				this.pfMentionOpen = false;
        				this.pfMentionHits = [];
        				this.pfLoadComments();
        				this.chargerGrille(true);
        			} else this.refresh();
        		}, (err) => this.pfFail(err));
        	}
        /*End_c8o_PageFunction*/'
