        	pfaAdmin(): any {
        		return (window as any).PfaAdmin;
        	}
        	pfaSyncChrome() {
        		var nom = "";
        		this.pfaUserName = this.nomBarre();
        		this.pfaUserRole = this.libelleRole();
        		if (this.pfaUserRole) {
        			try { window.sessionStorage.setItem("pfc:userRole", this.pfaUserRole); } catch (eRole) {}
        		}
        		var els = this.elements || [];
        		var lig = this.lignes || [];
        		var ports = this.participants || [];
        		var projets = 0;
        		var gens = 0;
        		var seen = {};
        		var seenL = {};
        		var i;
        		var j;
        		for (i = 0; i < els.length; i++) {
        			var el = els[i];
        			var actif = String(el.actif == null ? "true" : el.actif).toLowerCase();
        			if (actif === "false" || actif === "f" || actif === "0") continue;
        			var hasP = false;
        			for (j = 0; j < ports.length; j++) if (ports[j].codeElement === el.code) hasP = true;
        			if (!el.chefProjet || !hasP) {
        				if (!seen[el.code]) { seen[el.code] = 1; projets++; }
        			}
        		}
        		for (i = 0; i < lig.length; i++) {
        			var l = lig[i];
        			var la = String(l.actif == null ? "true" : l.actif).toLowerCase();
        			if (la === "false" || la === "f" || la === "0") continue;
        			if (!l.referent || !l.codeRole) {
        				if (!seenL[l.cle]) { seenL[l.cle] = 1; gens++; }
        			}
        		}
        		this.badgeProjets = projets;
        		this.badgeLignes = gens;
        	}
        	refresh() {
        		this.pfaSyncChrome();
        		try { var admin = this.pfaAdmin(); if (admin) admin.paint(this); } catch (e2) {}
        		try { this.ref.detectChanges(); } catch (e) {}
        	}
        	pfaBoot() {
        		var self = this;
        		var assets = this.c8o.endpointConvertigo + "/projects/PortefeuilleLCNC_fe/DisplayObjects/mobile/assets/";
        		if (!document.getElementById("pfa-admin-css")) {
        			var link = document.createElement("link");
        			link.id = "pfa-admin-css";
        			link.rel = "stylesheet";
        			link.href = assets + "css/pfa-admin.css?v=admin3";
        			document.head.appendChild(link);
        		}
        		if (document.getElementById("pfa-admin-js")) {
        			var deja = this.pfaAdmin();
        			if (deja) deja.boot(this);
        			return;
        		}
        		var script = document.createElement("script");
        		script.id = "pfa-admin-js";
        		script.src = assets + "js/pfa-admin.js?v=admin4";
        		script.onload = function() { var charge = self.pfaAdmin(); if (charge) charge.boot(self); };
        		document.head.appendChild(script);
        	}
        	pfaNav(event) {
        		var code = event;
        		if (code && code.route) code = code.route;
        		if (code && code.detail != null) code = code.detail;
        		code = String(code || "");
        		if (code.indexOf("logout") >= 0) { this.deconnecter(); return; }
        		if (code === "feries") { this.chargerFeries(); return; }
        		if (code && code !== "undefined") this.ouvrir(code);
        	}
        	pfaOnClick(event) {
        		var admin = this.pfaAdmin();
        		var dom = event;
        		if (event && event.root && event.root.out) dom = event.root.out;
        		else if (event && event.target) dom = event;
        		else if (event && event.event) dom = event.event;
        		if (admin && admin.click) admin.click(this, dom);
        	}
        	iso(d) {
        		var m = String(d.getMonth() + 1);
        		var day = String(d.getDate());
        		if (m.length < 2) m = "0" + m;
        		if (day.length < 2) day = "0" + day;
        		return d.getFullYear() + "-" + m + "-" + day;
        	}
        	genTrimestres(anneesAvant, anneesApres) {
        		var y0 = new Date().getFullYear();
        		var out = [];
        		var y;
        		var q;
        		for (y = y0 - anneesAvant; y <= y0 + anneesApres; y++) {
        			for (q = 1; q <= 4; q++) {
        				out.push({ value: String(y) + "-" + String(q), label: String(q) + "T " + String(y) });
        			}
        		}
        		return out;
        	}
        	lireTrimestres() {
        		var opts = this.trimestreOpts || [];
        		try {
        			var raw = window.sessionStorage.getItem("pfc:trimestres");
        			var list = raw ? JSON.parse(raw) : [];
        			if (!Array.isArray(list)) return [];
        			return list.map(function(v) { return String(v); }).filter(function(v) {
        				return opts.some(function(o) { return o.value === v; });
        			});
        		} catch (e) {
        			return [];
        		}
        	}
        	memoriserTrimestres(sel) {
        		try {
        			if (sel && sel.length) window.sessionStorage.setItem("pfc:trimestres", JSON.stringify(sel));
        			else window.sessionStorage.removeItem("pfc:trimestres");
        		} catch (e) {}
        	}
        	fixTrimestre() {
        		var d = new Date();
        		var q = Math.floor(d.getMonth() / 3) + 1;
        		this.trimestresSel = [String(d.getFullYear()) + "-" + String(q)];
        		this.appliquerTrimestres(false);
        	}
        	trimestreBornes(code) {
        		var p = String(code || "").split("-");
        		var year = Number(p[0]);
        		var q = Number(p[1]);
        		if (!year || !q) return null;
        		return {
        			start: new Date(year, (q - 1) * 3, 1),
        			end: new Date(year, q * 3, 0)
        		};
        	}
        	appliquerTrimestres(reload) {
        		var sel = this.trimestresSel || [];
        		if (!sel.length) {
        			var d0 = new Date();
        			var q0 = Math.floor(d0.getMonth() / 3) + 1;
        			sel = [String(d0.getFullYear()) + "-" + String(q0)];
        			this.trimestresSel = sel.slice();
        		}
        		var i;
        		var start = null;
        		var end = null;
        		for (i = 0; i < sel.length; i++) {
        			var b = this.trimestreBornes(sel[i]);
        			if (!b) continue;
        			if (!start || b.start < start) start = b.start;
        			if (!end || b.end > end) end = b.end;
        		}
        		if (!start || !end) return;
        		this.dateFrom = this.iso(start);
        		this.dateTo = this.iso(end);
        		this.today = this.iso(new Date());
        		this.chargeFrom = this.dateFrom;
        		this.chargeTo = this.dateTo;
        		var monday = new Date(start.getTime());
        		monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
        		this.dayCount = Math.round((end.getTime() - monday.getTime()) / 86400000) + 1;
        		if (reload) this.chargerGrille();
        		else this.refresh();
        	}
        	choisirTrimestres(event) {
        		var raw = event;
        		if (raw && typeof raw === "object" && !Array.isArray(raw)) {
        			if (raw.value !== undefined && raw.detail == null) raw = raw.value;
        			else if (raw.event && raw.event.value !== undefined) raw = raw.event.value;
        			else if (raw.detail && raw.detail.value !== undefined) raw = raw.detail.value;
        		}
        		if (Array.isArray(raw)) this.trimestresSel = raw;
        		this.memoriserTrimestres(this.trimestresSel);
        		if (!this.trimestresSel || !this.trimestresSel.length) {
        			this.fixTrimestre();
        			this.chargerGrille();
        			return;
        		}
        		this.appliquerTrimestres(true);
        	}
        	libelleRole() {
        		var code = "";
        		var u = null;
        		try { if (this.sessionUser) u = this.sessionUser(); } catch (eU) {}
        		if (!u) {
        			var so = this.routerProvider && this.routerProvider.sharedObject;
        			u = so && so.user;
        		}
        		if (u) {
        			code = String(u.roleTest || u.codeRole || "").toUpperCase();
        			if (!code && u.role) {
        				var roles = Object.prototype.toString.call(u.role) === "[object Array]" ? u.role : [u.role];
        				var i;
        				for (i = 0; i < roles.length; i++) {
        					var raw = String(roles[i] && roles[i].role != null ? roles[i].role : roles[i]).toUpperCase();
        					if (raw.indexOf("PORTEFEUILLE_TEST_") === 0) raw = raw.slice(18);
        					if (raw === "GESTIONNAIRE" || raw === "CONTRIBUTEUR" || raw === "LECTEUR") { code = raw; break; }
        				}
        			}
        		}
        		if (code.indexOf("PORTEFEUILLE_TEST_") === 0) code = code.slice(18);
        		if (!code || code === "SANS_ROLE") {
        			var cle = "";
        			try { cle = this.cleActeur || this.acteurSession() || ""; } catch (eC) { cle = this.cleActeur || ""; }
        			var n;
        			for (n = 0; n < (this.lignes || []).length; n++) {
        				var l = this.lignes[n];
        				if (String(l.cle) === String(cle) || String(l.cleExterne || "").toUpperCase() === String(cle).toUpperCase()) {
        					code = String(l.codeRole || "").toUpperCase();
        					break;
        				}
        			}
        		}
        		if (code === "GESTIONNAIRE") return "Gestionnaire";
        		if (code === "LECTEUR") return "Lecteur";
        		if (code === "CONTRIBUTEUR") return "Contributeur";
        		if (this.canAdmin) return "Gestionnaire";
        		return code ? code : "";
        	}
        	nomBarre() {
        		function propre(v) {
        			var s = String(v == null ? "" : v).trim();
        			if (!s) return "";
        			var first = s.split(/\s+/)[0];
        			if (/^AC\d/i.test(first)) return "";
        			return first;
        		}
        		var u = null;
        		try { if (this.sessionUser) u = this.sessionUser(); } catch (eU) {}
        		if (!u) {
        			var so = this.routerProvider && this.routerProvider.sharedObject;
        			u = so && so.user;
        		}
        		var nom = "";
        		if (u) nom = propre(u.prenom) || propre(u.displayName) || propre(u.libelle) || propre(u.nom) || propre(u.name);
        		if (!nom) {
        			try { nom = propre(window.sessionStorage.getItem("pfc:userName") || ""); } catch (eN) {}
        		}
        		if (nom) { try { window.sessionStorage.setItem("pfc:userName", nom); } catch (eS) {} }
        		else { try { window.sessionStorage.removeItem("pfc:userName"); } catch (eC) {} }
        		return nom;
        	}
        	nomActeur() {
        		var u = this.sessionUser();
        		if (u && (u.displayName || u.nom)) return String(u.displayName || ((u.prenom || "") + " " + (u.nom || "")).trim());
        		var i;
        		for (i = 0; i < (this.rows || []).length; i++) {
        			if (String(this.rows[i].id) === String(this.cleActeur)) return this.rows[i].name;
        		}
        		return this.cleActeur || "aucun acteur";
        	}
        	periodeLabel() {
        		return (this.dateFrom || "") + " → " + (this.dateTo || "");
        	}
        	has(code) {
        		return (this.droits || []).indexOf(code) >= 0;
        	}
        	asList(v) {
        		if (v == null) return [];
        		if (Object.prototype.toString.call(v) === "[object Array]") return v;
        		if (v.row != null) return this.asList(v.row);
        		return [v];
        	}
        	doc(out) {
        		if (!out) return {};
        		if (out.document) return out.document;
        		if (out.transaction) {
        			var list = this.asList(out.transaction);
        			var i;
        			for (i = 0; i < list.length; i++) {
        				var d = list[i].document || list[i];
        				if (d && d.error) return d;
        			}
        		}
        		return out;
        	}
        	appel(seq, vars): any {
        		var self = this;
        		var args = ["PortefeuilleLCNC_be." + seq];
        		var k;
        		vars = vars || {};
        		for (k in vars) {
        			if (Object.prototype.hasOwnProperty.call(vars, k)) {
        				args.push(k);
        				args.push(vars[k] == null ? "" : String(vars[k]));
        			}
        		}
        		var p = this.c8o.callJson.apply(this.c8o, args);
        		return new Promise(function(ok, ko) {
        			p.then(function(out) { if (self.nonConnecte(self.doc(out))) self.versLogin(); ok(out); return p; });
        			if (p.fail) p.fail(function(err) { ko(err); });
        		});
        	}
        	sessionUser(): any {
        		var so: any = this.routerProvider && this.routerProvider.sharedObject;
        		return (so && so.user) ? so.user : null;
        	}
        	acteurSession(): string {
        		var u = this.sessionUser();
        		return (u && u.codeAgent) ? String(u.codeAgent).trim() : "";
        	}
        	nonConnecte(d): boolean {
        		if (!d || !d.error) return false;
        		var e = d.error;
        		return String(e.code || "") === "401" || String(e.message || e).indexOf("Non authentifi") === 0;
        	}
        	versLogin() {
        		var so: any = this.routerProvider && this.routerProvider.sharedObject;
        		if (so) {
        			so.user = null;
        			so.isConnected = false;
        		}
        		this.routerProvider.navigateRoot("Login", false, null);
        	}
        	deconnecter() {
        			var self = this;
        			var go = function () {
        				self.versLogin();
        			};
        			try {
        				["pfc:trimestres", "pfc:vue", "pg2:pfc-plan-de-charge", "pfc:userName", "pfc:userRole", "pfc:canAdmin"].forEach(function (k) { window.sessionStorage.removeItem(k); });
        			} catch (e) {}
        			if (!this.pfaLeaving) {
        				this.pfaLeaving = true;
        				try {
        					var p: any = this.c8o.callJson("lib_common_be.auth__logout", "__disableAutologin", "true");
        					if (p && p.then) p.then(function () { return null; });
        				} catch (e2) {}
        			}
        			go();
        		}
        	setBo(event, key) {
        		var v = "";
        		if (event && event.target && event.target.value != null) v = String(event.target.value);
        		else if (event && event.detail && event.detail.value != null) v = String(event.detail.value);
        		if (!this.boForm) this.boForm = {};
        		this.boForm[key] = v;
        	}
        	setComment(event) {
        		var v = "";
