        				out = out.replace(new RegExp("@" + esc + "(?![A-Za-zÀ-ÿ0-9_-])", "g"), ''<span class="pfm-mention">@'' + name + "</span>");
        			});
        			out = out.replace(/@([A-Za-zÀ-ÿ0-9_-]+)/g, (full, name, offset, str) => {
