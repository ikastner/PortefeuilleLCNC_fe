        		this.chefOpts = [{ value: "", label: "À définir" }].concat(gens);
        		var parts = (this.participants || []).filter(function (p) { return found && String(p.codeElement) === String(found.code); });
        		this.draftParticipants = parts.filter(function (p) { return self.onFlag(p.manuel); }).map(function (p) { return String(p.cle); });
        		this.participantsInit = this.draftParticipants.slice().sort().join(",");
        		this.participantOpts = (this.lignes || []).filter(function (l) {
        			return self.onFlag(l.actif == null ? "true" : l.actif) || self.draftParticipants.indexOf(String(l.cle)) >= 0;
        		}).map(function (l) {
        			return { value: String(l.cle), label: l.libelle || l.cle };
        		}).sort(function (a, b) { return String(a.label).localeCompare(String(b.label), "fr"); });
        		this.draftAuto = parts.filter(function (p) { return Number(p.jours || 0) > 0; }).map(function (p) {
        			var l = self.lignePar(p.cle);
        			var nom = (l && (l.libelle || l.cle)) || p.cle;
        			var j = Number(p.jours || 0);
        			return { nom: nom, ini: self.initiales(nom), couleur: (l && l.couleur) || "#1A428A", n: j, jours: String(j).replace(".", ",") + " j" };
        		}).sort(function (a, b) { return b.n - a.n || String(a.nom).localeCompare(String(b.nom), "fr"); });
        		this.draftAutoTitre = "Via le plan de charge (" + this.draftAuto.length + ")";
        		this.animerOuverture();
        		this.rafraichir();
        	}
        	ouvrirNature(code) {
        		var found = null;
        		var i;
        		for (i = 0; i < (this.types || []).length; i++) if (this.types[i].code === code) found = this.types[i];
        		this.drawerKind = "nature";
        		this.draftIsNew = !found;
        		this.draftCode = found ? found.code : "";
        		this.draftLibelle = found ? (found.libelle || "") : "";
        		this.draftAide = found ? (found.aide || "") : "";
        		this.draftCouleur = found ? (found.couleurFond || "#8B194D") : "#8B194D";
        		this.draftActif = found ? this.onFlag(found.actif == null ? "true" : found.actif) : true;
        		this.drawerEyebrow = found ? "Hors projet" : "Nouveau hors projet";
        		this.drawerTitle = found ? found.libelle : "Nouveau hors projet";
        		this.drawerSub = "";
        		this.animerOuverture();
        		this.rafraichir();
        	}
        	animerOuverture() {
        		this.drawerShown = false;
        		this.drawerOn = true;
        		this.rafraichir();
        		var self = this;
        		setTimeout(function () { self.drawerShown = true; self.rafraichir(); }, 20);
        	}
        	fermer() {
        		var self = this;
        		if (!this.drawerShown) { this.drawerOn = false; this.drawerShown = false; this.rafraichir(); return; }
        		this.drawerShown = false;
        		this.rafraichir();
        		setTimeout(function () { self.drawerOn = false; self.rafraichir(); }, 260);
        	}
        	sauver() { if (this.drawerKind === "nature") this.sauverNature(); else this.sauverProjet(); }
        	setParticipants(event) {
        		var v = event && event.value !== undefined ? event.value : (event && event.event && event.event.value !== undefined ? event.event.value : event);
        		this.draftParticipants = Array.isArray(v) ? v.map(function (x) { return String(x); }) : [];
        		this.rafraichir();
        	}
        	sauverParticipants(code) {
        		var liste = (this.draftParticipants || []).map(function (x) { return String(x); }).sort().join(",");
        		if (!code || liste === this.participantsInit) return Promise.resolve(true);
        		var self = this;
        		return this.appel("Participant_Remplacer", { cleActeur: this.cleActeur, code: code, participants: liste }).then(function (out) {
        			var raw: any = out;
        			var res = (raw && raw.resultat) || {};
