        				return false;
        			}
        			return true;
        		});
        	}
        	codeParLibelle(libelle) {
        		var self = this;
        		return this.appel("Referentiel_Lire", {}).then(function (out) {
        			var raw: any = out;
        			var d = self.doc(out);
        			var els = self.asList((raw && raw.elements) || (d && d.elements));
        			var i;
        			for (i = 0; i < els.length; i++) if (String(els[i].libelle) === String(libelle)) return String(els[i].code);
        			return "";
        		});
        	}
        	sauverProjet() {
        		var self = this;
        		if (!String(this.draftLibelle || "").trim()) { this.message = "Le libellé est obligatoire."; this.rafraichir(); return; }
        		var libelle = String(this.draftLibelle).trim();
        		this.appel("Element_Enregistrer", {
        			cleActeur: this.cleActeur,
        			code: this.draftCode || "",
        			libelle: String(this.draftLibelle).trim(),
        			couleur: this.draftCouleur || "",
        			actif: this.draftActif ? "true" : "false",
        			lcNc: this.draftLc || "",
        			statutCatalogue: this.normaliserStatut(this.draftStatut),
        			chefProjet: this.draftChef || ""
        		}).then(function (out) {
        			if (!self.okOf(out)) { self.message = "Enregistrement impossible."; self.rafraichir(); return; }
        			var code = self.draftCode ? Promise.resolve(String(self.draftCode)) : self.codeParLibelle(libelle);
        			return code.then(function (c) { return self.sauverParticipants(c); }).then(function () {
        				self.fermer();
        				self.ionViewDidEnter();
        			});
        		});
        	}
        	sauverNature() {
        		var self = this;
        		if (!String(this.draftLibelle || "").trim()) { this.message = "Le libellé est obligatoire."; this.rafraichir(); return; }
        		var code = this.draftCode || ("NATURE_" + Date.now().toString(36).toUpperCase());
        		this.appel("Nature_Enregistrer", {
        			cleActeur: this.cleActeur,
        			code: code,
        			libelle: String(this.draftLibelle).trim(),
        			aide: this.draftAide || "",
        			couleur: this.draftCouleur || "",
        			actif: this.draftActif ? "true" : "false"
        		}).then(function (out) {
        			if (!self.okOf(out)) { self.message = "Enregistrement impossible."; self.rafraichir(); return; }
        			self.fermer();
        			self.ionViewDidEnter();
        		});
        	}
        	supprimerNature() {
        		if (this.draftIsNew || !this.draftCode) return;
        		if (!window.confirm("Supprimer ?")) return;
        		var self = this;
        		this.appel("Nature_Supprimer", { cleActeur: this.cleActeur, code: this.draftCode }).then(function (out) {
        			var d = self.doc(out);
        			var bag = d.sql_output || d;
        			var row = self.asList(bag.row || bag)[0] || {};
        			if (String(row.nb || "0") === "0") { self.message = "Suppression impossible."; self.rafraichir(); return; }
        			self.fermer();
        			self.ionViewDidEnter();
        		});
        	}
        	supprimerProjet() {
        		if (this.draftIsNew || !this.draftCode) return;
        		if (!window.confirm("Supprimer ?")) return;
        		var self = this;
        		this.appel("Element_Supprimer", { cleActeur: this.cleActeur, code: this.draftCode }).then(function (out) {
        			var d = self.doc(out);
        			var bag = d.sql_output || d;
        			var row = self.asList(bag.row || bag)[0] || {};
        			if (String(row.nb || "0") === "0") { self.message = "Suppression impossible."; self.rafraichir(); return; }
        			self.fermer();
        			self.ionViewDidEnter();
        		});
        	}
        	navSidebar(event) {
        		var code = event;
        		if (code && code.route) code = code.route;
        		if (code && code.detail != null) code = code.detail;
        		code = String(code || "");
        		if (code.indexOf("logout") >= 0) { this.deconnecter(); return; }
        		if (code === "roles") { this.routerProvider.navigateRoot("Roles", false, null); return; }
        		if (code === "projets") return;
        		try { window.sessionStorage.setItem("pfc:vue", code === "grille" ? "grille" : code); } catch (e) {}
        		if (code === "dashboard-v2") {
        			try { window.sessionStorage.setItem("pfc:tdb", "v2"); } catch (eV) {}
        			this.routerProvider.navigateRoot("TableauDeBord", false, null);
        			return;
        		}
        		if (code === "dashboard") this.routerProvider.navigateRoot("TableauDeBord", false, null);
        		else if (code === "lignes") this.routerProvider.navigateRoot("Collaborateurs", false, null);
        		else this.routerProvider.navigateRoot("PlanDeCharge", false, null);
        	}
        	deconnecter() {
        			try { window.sessionStorage.removeItem("pfc:userName"); window.sessionStorage.removeItem("pfc:userRole"); window.sessionStorage.removeItem("pfc:canAdmin"); } catch (eL) {}
        			var so = this.routerProvider && this.routerProvider.sharedObject;
        			if (so) { so.user = null; so.isConnected = false; }
        			try { this.c8o.callJson("lib_common_be.auth__logout", "__disableAutologin", "true"); } catch (eO) {}
        			this.routerProvider.navigateRoot("Login", false, null);
        		}
