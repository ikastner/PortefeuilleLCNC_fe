          .dash-axe button[aria-pressed="true"]{background:#fff;color:#0F2B5B;font-weight:600;box-shadow:0 1px 2px rgba(15,43,91,.12)}
          .tdb .dash-grid--vertical .dash-row:not(.dash-row--head){grid-template-columns:200px repeat(5,minmax(0,1fr)) 104px;grid-template-rows:40px 40px}
          .tdb .dash-grid--vertical .dash-row--head{grid-template-columns:200px repeat(5,minmax(0,1fr)) 104px;grid-template-rows:52px}
