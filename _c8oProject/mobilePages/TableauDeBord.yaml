          .tdb .dash-grid--vertical button.dash-cell.is-am{margin-top:6px !important;margin-bottom:1px !important;border-radius:8px 8px 3px 3px}
          .tdb .dash-grid--vertical button.dash-cell.is-pm{margin-top:1px !important;margin-bottom:6px !important;border-radius:3px 3px 8px 8px}
          
          /* qfq : titre + filtres + jours dans la carte, collés au scroll, voile #F4F7FB */
          .tdb{--qfq-stick:12px}
          .tdb .dash-main{overflow:visible !important;display:block !important;max-height:none !important;border-radius:18px !important;background:#fff !important;padding:0 !important}
          .tdb .qfq-sentinel{height:1px;margin:0;padding:0;overflow:hidden;pointer-events:none}
