          }
          
          /* libellé : une ligne en mode empilé, deux en côte à côte, jamais hors de la case */
          .tdb .dash-grid--cells button.dash-cell .dash-seg__txt{ max-width: 100%; min-width: 0; line-height: 1.2; word-break: break-word; }
