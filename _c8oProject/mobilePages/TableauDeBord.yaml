          .tdb .dash-toolbar{position:sticky !important;top:var(--qfq-stick, 12px) !important;z-index:40 !important;background:#fff !important;border-radius:18px 18px 0 0 !important;box-shadow:none !important;border-top:0 !important;border-left:0 !important;border-right:0 !important}
          .tdb .dash-toolbar.is-stuck{box-shadow:0 -18px 0 18px #F4F7FB !important}
